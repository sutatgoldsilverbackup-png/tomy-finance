      await refresh(); close(); render(true);
    }, 'บันทึกตู้แล้ว');
  });
}

/* ---------- ซื้อน้ำมันเข้าตู้ ---------- */
route('fuel-buy', {
  form: true,
  html() {
    return topbar('ซื้อน้ำมันเข้าตู้', '#/fuel') + '<div id="slipBox"></div>' + dateField('bd', 'วันที่', todayStr()) +
      '<div class="fld"><div class="lbl">ชนิดน้ำมัน<span id="tag_ft"></span></div><div class="grid4" id="ftBox"></div></div>' +
      '<div class="grid2"><div class="fld"><label class="lbl" for="bl">ลิตร<span id="tag_l"></span></label><input id="bl" class="input" inputmode="decimal"></div><div class="fld"><label class="lbl" for="bp">ราคา/ลิตร<span id="tag_p"></span></label><input id="bp" class="input" inputmode="decimal"></div></div>' +
      '<div class="fld"><div class="lbl">เติมเข้าตู้</div><div class="grid3" id="pumpBox"></div></div>' +
      '<div class="fld"><div class="lbl">ปั๊ม<span id="tag_st"></span></div><div class="grid4" id="stBox"></div></div>' +
      '<div class="fld"><label class="lbl" for="bpc">บัตรสะสมแต้ม</label><select id="bpc" class="input">' + pointCardOptions('') + '</select></div>' +
      '<div class="fld"><label class="lbl" for="bpay">ชำระด้วย</label><select id="bpay" class="input">' + payOptions('cash') + '</select></div>' +
      '<div class="fld"><label class="lbl" for="by">ผู้จ่ายเงิน</label><input id="by" class="input" placeholder="เช่น ตัวเอง"><div class="row-flex" id="byChips" style="flex-wrap:wrap;gap:6px"></div></div>' +
      field('bn', 'หมายเหตุ', '', 'placeholder="เช่น แม่ให้แล้ว"') +
      '<label class="check"><input type="checkbox" id="bpers">บันทึกเป็นรายจ่ายในบัญชีส่วนตัวด้วย</label>' +
      '<div class="box pad" id="bcalc"></div>' +
      '<div class="savebar"><div><button class="btn" id="save">บันทึกการซื้อ</button></div></div>';
  },
  mount(p, el) {
    const pumps = D.activePumps();
    const S = { fuelType: '95', station: 'PT', pumpId: pumps[0] ? pumps[0].id : '', slipUrl: '', slipThumb: '' };
    const pr = D.price('95'); if (pr) $('#bp', el).value = pr.price;
    const drawChips = () => {
      $('#ftBox', el).innerHTML = chips('ft', ['95', '91', 'เบนซิน', 'ดีเซล'], S.fuelType);
      $('#stBox', el).innerHTML = chips('st', ['ปตท.', 'PT', 'บางจาก', 'อื่นๆ'], S.station);
      $('#pumpBox', el).innerHTML = chips('pm', pumps.map(x => ({ value: x.id, label: esc(x.name.replace(/^ตู้/, '')) })).concat([{ value: '', label: 'เก็บสต็อก' }]), S.pumpId);
      bindChips(el, 'ft', v => { S.fuelType = v; const q = D.price(v); if (q) $('#bp', el).value = q.price; calc(); });
      bindChips(el, 'st', v => { S.station = v; calc(); });
      bindChips(el, 'pm', v => { S.pumpId = v; });
    };
    // ผู้จ่ายที่เคยใช้
    const payers = uniq(['ตัวเอง'].concat((App.data.fuel.purchases || []).map(x => x.paidBy)));
    $('#byChips', el).innerHTML = payers.slice(0, 5).map(n => '<button type="button" class="chip small" data-by="' + esc(n) + '">' + esc(n) + '</button>').join('');
    $$('[data-by]', el).forEach(b => b.onclick = () => { $('#by', el).value = b.dataset.by; });

    const calc = () => {
      const pay = $('#bpay', el).value;
      const r = calcFuel({ liters: $('#bl', el).value, price: $('#bp', el).value, pointCardId: $('#bpc', el).value, payCardId: pay.indexOf('card:') === 0 ? pay.slice(5) : '', station: S.station });
      const pts = [r.points ? 'บัตรแต้ม +' + r.points : '', r.payPoints ? 'บัตรจ่าย +' + r.payPoints : ''].filter(Boolean).join(' · ');
      $('#bcalc', el).innerHTML = '<div class="line"><span>ราคาเต็ม</span><span>' + fmt2(r.total) + '</span></div>' +
        (r.discount ? '<div class="line"><span>ส่วนลด' + (r.discountLiters ? ' (โควตา ' + fmt(r.discountLiters) + ' ล.)' : '') + '</span><span class="in">+' + fmt2(r.discount) + '</span></div>' : '') +
        (pts ? '<div class="line"><span>แต้มที่ได้</span><span>' + pts + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #F1F5F9;margin-top:6px;padding-top:10px"><span class="t">จ่ายจริง</span><span style="font-size:28px;font-weight:700" class="out">−' + fmt2(r.netPaid) + '</span></div>';
    };
    ['#bl', '#bp'].forEach(s => $(s, el).addEventListener('input', calc));
    ['#bpc', '#bpay'].forEach(s => $(s, el).addEventListener('change', calc));
    drawChips(); calc();

    // สลิปปั๊ม
    const drawSlip = (read) => {
      const box = $('#slipBox', el);
      box.innerHTML = (S.slipThumb ? '<div class="box slip"><div class="thumb"><img src="' + esc(S.slipThumb) + '" alt="รูปใบเสร็จ"></div><div class="grow"><div class="t">' + (read ? 'Gemini อ่านใบเสร็จแล้ว' : 'แนบใบเสร็จแล้ว') + '</div><div class="s">' + (read ? 'ตรวจสอบก่อนบันทึก' : '') + '</div></div></div>' : '') +
        '<div class="grid2" style="' + (S.slipThumb ? 'margin-top:8px' : '') + '"><button class="chip" data-slip="1"><span class="ms" aria-hidden="true">photo_camera</span>ถ่ายใบเสร็จ</button><button class="chip" data-slip="0"><span class="ms" aria-hidden="true">photo_library</span>เลือกจากคลัง</button></div>';
      $$('[data-slip]', box).forEach(b => b.onclick = async () => {
        const file = await pickFile({ camera: b.dataset.slip === '1' });
        if (!file) return;
        try {
          const dataUrl = await compressImage(file, 800, 0.7);
          S.slipThumb = dataUrl;
          if (App.data.settings.hasGemini) {
            showLoading('Gemini กำลังอ่านใบเสร็จ…');
            const r = await api('readSlip', { base64: dataUrl, kind: 'fuel' });
            S.slipUrl = r.image ? r.image.url : '';
            const f = r.fields || {};
            if (f.date) { $('#bd', el).value = f.date; $('#bd_t', el).textContent = thDate(f.date); }
            if (f.fuelType) { S.fuelType = String(f.fuelType); $('#tag_ft', el).innerHTML = aiTag(); }
            if (f.station) { S.station = f.station; $('#tag_st', el).innerHTML = aiTag(); }
            if (num(f.liters)) { $('#bl', el).value = num(f.liters); $('#tag_l', el).innerHTML = aiTag(); }
            if (num(f.pricePerLiter)) { $('#bp', el).value = num(f.pricePerLiter); $('#tag_p', el).innerHTML = aiTag(); }
            drawChips(); calc(); drawSlip(true);
            toast('อ่านใบเสร็จแล้ว ตรวจสอบก่อนบันทึก', 'ok');
          } else {
            showLoading('กำลังอัปโหลด…');
            S.slipUrl = (await uploadDataUrl(dataUrl, 'fuel_' + Date.now() + '.jpg')).url;
            drawSlip(false);
          }
        } catch (e) { toast(e.message, 'err'); } finally { hideLoading(); }
      });
    };
    drawSlip(false);

    $('#save', el).onclick = (e) => busy(e.currentTarget, async () => {
      const pay = $('#bpay', el).value;
      const rec = { date: $('#bd', el).value, purpose: 'ตู้', station: S.station, fuelType: S.fuelType, liters: num($('#bl', el).value), pricePerLiter: num($('#bp', el).value),
        pointCardId: $('#bpc', el).value, payCardId: pay.indexOf('card:') === 0 ? pay.slice(5) : '', paidBy: $('#by', el).value.trim(), pumpId: S.pumpId,
        note: $('#bn', el).value.trim(), slipUrl: S.slipUrl, addToPersonal: $('#bpers', el).checked, payMethod: pay === 'transfer' ? 'โอน' : pay === 'cash' ? 'เงินสด' : 'บัตรเครดิต' };
      if (rec.liters <= 0) throw new Error('กรุณากรอกจำนวนลิตร');
      if (rec.pricePerLiter <= 0) throw new Error('กรุณากรอกราคาต่อลิตร');
      await api('saveFuelPurchase', { record: rec });
      await refresh(); go('#/fuel');
    }, 'บันทึกการซื้อแล้ว');
  }
});

route('fuel-meter', {
  form: true,
  html(p) {
    return topbar('จดมิเตอร์', '#/fuel') + '<div class="grid2" id="pumpBox"></div>' + dateField('md', 'วันที่เปิดตู้', todayStr()) +
      '<div class="box pad" style="text-align:center"><label for="mm" class="s">ตัวเลขมิเตอร์ (ลิตร)</label><input id="mm" class="amount-input" inputmode="decimal" placeholder="0"><div class="s" id="mprev"></div></div>' +
      '<div id="firstBox"></div><div class="box pad" id="mcalc"><div class="s">กรอกตัวเลขมิเตอร์ ระบบจะคำนวณให้</div></div>' +
      field('mc', 'เงินเหรียญที่นับได้ (ไม่บังคับ)', '', 'inputmode="decimal"') + '<div id="mwarn"></div>' +
      '<div class="photos" id="mphoto"></div>' +
      '<div class="savebar"><div><button class="btn" id="save">บันทึก</button></div></div>';
  },
  mount(p, el) {
    const pumps = D.activePumps();
    const S = { pumpId: p.pump || (pumps[0] || {}).id, photo: '' };
    const drawPumps = () => {
      $('#pumpBox', el).innerHTML = chips('pm', pumps.map(x => ({ value: x.id, label: esc(x.name) })), S.pumpId);
      bindChips(el, 'pm', v => { S.pumpId = v; drawPrev(); preview(); });
    };
    const drawPrev = () => {
      const st = D.pumpStatus(S.pumpId) || {};
      $('#mprev', el).textContent = st.lastMeter !== null && st.lastMeter !== undefined ? 'ครั้งก่อน ' + fmt(st.lastMeter) + ' ล. · ' + thDate(st.lastOpen) : 'ยังไม่เคยจดมิเตอร์ตู้นี้';
      $('#firstBox', el).innerHTML = (st.lastMeter === null || st.lastMeter === undefined) ? field('mp', 'ตัวเลขมิเตอร์ครั้งก่อน (ครั้งแรกเท่านั้น)', '', 'inputmode="decimal" placeholder="ไม่รู้ ให้เว้นว่าง"') : '';
      const mp = $('#mp', el); if (mp) mp.addEventListener('input', debPreview);
    };
    const preview = async () => {
      const meter = $('#mm', el).value;
      if (meter === '') { $('#mcalc', el).innerHTML = '<div class="s">กรอกตัวเลขมิเตอร์ ระบบจะคำนวณให้</div>'; $('#mwarn', el).innerHTML = ''; return; }
      $('#mcalc', el).innerHTML = '<div class="row-flex s"><span class="spinner" aria-hidden="true"></span>กำลังคำนวณ…</div>';
      try {
        const mp = $('#mp', el);
        const r = await api('previewMeterReading', { record: { pumpId: S.pumpId, date: $('#md', el).value, meterLiters: num(meter), cashCollected: $('#mc', el).value, prevMeter: mp && mp.value !== '' ? num(mp.value) : undefined } });
        if (r.liters === '' || r.liters === undefined) { $('#mcalc', el).innerHTML = '<div class="s">ครั้งแรก: บันทึกเป็นตัวเลขตั้งต้น (ยังคำนวณยอดขายไม่ได้)</div>'; return; }
        const pump = D.pump(S.pumpId);
        $('#mcalc', el).innerHTML = (r.liters < 0 ? '<div class="err-text">ตัวเลขน้อยกว่าครั้งก่อน กรุณาตรวจสอบ</div>' : '') +
          '<div class="line"><span>ขายได้</span><span>' + fmt2(r.liters) + ' ลิตร</span></div>' +
          '<div class="line"><span>ยอดขาย (× ' + fmt2(pump.sellPrice) + ')</span><span class="in">+' + fmt2(r.salesBaht) + '</span></div>' +
          '<div class="line"><span>ต้นทุนเฉลี่ยในตู้ (× ' + fmt2(r.costPerLiter) + ')</span><span class="out">−' + fmt2(r.liters * r.costPerLiter) + '</span></div>' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #F1F5F9;margin-top:6px;padding-top:10px"><span class="t">กำไรรอบนี้</span><span style="font-size:28px;font-weight:700" class="' + (r.profit >= 0 ? 'in' : 'out') + '">' + money(r.profit, r.profit >= 0 ? 'in' : 'out') + '</span></div>';
        $('#mwarn', el).innerHTML = r.cashDiff !== '' && r.cashDiff !== undefined && Math.abs(r.cashDiff) >= 1
          ? '<div class="box row-flex warn" style="padding:12px 14px;background:#FFFBEB;border-color:#FCD34D"><span class="ms" aria-hidden="true">warning</span><span class="t">' + (r.cashDiff < 0 ? 'เงินขาดจากยอดขาย ' : 'เงินเกินยอดขาย ') + fmt2(Math.abs(r.cashDiff)) + ' บาท</span></div>' : '';
      } catch (e) { $('#mcalc', el).innerHTML = '<div class="err-text">' + esc(e.message) + '</div>'; }
    };
    const debPreview = debounce(preview, 600);
    $('#mm', el).addEventListener('input', debPreview);
    $('#mc', el).addEventListener('input', debPreview);
    $('#md', el).addEventListener('change', debPreview);
    const drawPhoto = () => {
      $('#mphoto', el).innerHTML = (S.photo ? '<div><img src="' + esc(S.photo) + '" alt="รูปหน้าปัดมิเตอร์"></div>' : '') + '<button type="button" class="add" id="mph" aria-label="ถ่ายรูปหน้าปัดมิเตอร์"><span class="ms" aria-hidden="true">photo_camera</span></button>';
      $('#mph', el).onclick = async () => { const f = await pickFile({ camera: true }); if (f) { S.photo = await compressImage(f, 800, 0.7); drawPhoto(); } };
    };
    drawPumps(); drawPrev(); drawPhoto();

    $('#save', el).onclick = (e) => busy(e.currentTarget, async () => {
      if ($('#mm', el).value === '') throw new Error('กรุณากรอกตัวเลขมิเตอร์');
      const mp = $('#mp', el);
      let photoUrl = '';
      if (S.photo) photoUrl = (await uploadDataUrl(S.photo, 'meter_' + Date.now() + '.jpg')).url;
      const r = await api('saveMeterReading', { record: { pumpId: S.pumpId, date: $('#md', el).value, meterLiters: num($('#mm', el).value), cashCollected: $('#mc', el).value, photoUrl, prevMeter: mp && mp.value !== '' ? num(mp.value) : undefined } });
      if (r.warning) toast(r.warning, 'warn', 6000);
      await refresh(); go('#/fuel');
    }, 'บันทึกมิเตอร์แล้ว');
  }
});

  mount(p, el) {

    $('#typeBox', el).innerHTML = EVENT_TYPES.map(t => '<button type="button" class="chip left' + (t[0] === S.type ? ' on' : '') + '" data-chip="ty" data-value="' + t[0] + '" aria-pressed="' + (t[0] === S.type) + '"><span class="ms" aria-hidden="true">' + t[1] + '</span>' + t[0] + '</button>').join('');
    bindChips(el, 'ty', v => { S.type = v; drawExtra(); });
    const drawExtra = () => {
      const pump = D.pump(S.pumpId) || {}, st = D.pumpStatus(S.pumpId) || {};
      let h = '';

      else if (S.type === 'ปรับราคาขาย') h = field('ep', 'ราคาขายใหม่ (บาท/ลิตร)', pump.sellPrice || '', 'inputmode="decimal"');
      else if (S.type !== 'ฝากเงินเหรียญ') h = '<div class="fld"><label class="lbl" for="ec">ค่าเสียหาย / ค่าใช้จ่าย (บาท)</label><input id="ec" class="input out" inputmode="decimal" style="font-weight:700"></div>' +
        '<label class="check"><input type="checkbox" id="ex" ' + (['โดนงัด', 'ซ่อม / บำรุง'].indexOf(S.type) >= 0 ? 'checked' : '') + '>หักเป็นค่าใช้จ่ายธุรกิจ (กำไรเดือนนี้ลดลง)</label>';
      else h = field('ec', 'จำนวนเงินที่ฝาก (บาท)', '', 'inputmode="decimal"');
      $('#extra', el).innerHTML = h;
    };
    const drawPhotos = () => {
      $('#ephotos', el).innerHTML = S.photos.map((u, i) => '<div><img src="' + esc(u) + '" alt="รูปที่ ' + (i + 1) + '"><button type="button" class="icb" data-rm="' + i + '" aria-label="ลบรูปที่ ' + (i + 1) + '" style="position:absolute;top:2px;right:2px;width:36px;height:36px;background:rgba(15,23,42,.7);color:#fff"><span class="ms" aria-hidden="true" style="font-size:20px">close</span></button></div>').join('') +
        (S.photos.length < 6 ? '<button type="button" class="add" id="eadd" aria-label="เพิ่มรูป"><span class="ms" aria-hidden="true">add_a_photo</span></button>' : '');
      $$('[data-rm]', el).forEach(b => b.onclick = () => { S.photos.splice(Number(b.dataset.rm), 1); drawPhotos(); });
      const add = $('#eadd', el);
      if (add) add.onclick = async () => { const files = await pickFile({ multiple: true }); for (const f of (files || []).slice(0, 6 - S.photos.length)) S.photos.push(await compressImage(f, 800, 0.7)); drawPhotos(); };
    };
    drawExtra(); drawPhotos();

    $('#save', el).onclick = (e) => busy(e.currentTarget, async () => {
      const rec = { pumpId: S.pumpId, date: $('#ed', el).value, eventType: S.type, detail: $('#et', el).value.trim() };
      if (S.type === 'ปรับสต็อก') { if ($('#el', el).value === '') throw new Error('กรุณากรอกจำนวนลิตร'); rec.liters = num($('#el', el).value); }
      else if (S.type === 'ปรับราคาขาย') { rec.newPrice = num($('#ep', el).value); if (rec.newPrice <= 0) throw new Error('กรุณากรอกราคาขายใหม่'); }
      else { rec.cost = num(($('#ec', el) || {}).value); rec.asExpense = !!($('#ex', el) && $('#ex', el).checked); }

      for (let i = 0; i < S.photos.length; i++) urls.push((await uploadDataUrl(S.photos[i], 'event_' + Date.now() + '_' + i + '.jpg')).url);
      rec.photoUrls = urls;
      await api('saveFuelEvent', { record: rec });
      await refresh(); go('#/fuel');
    }, 'บันทึกเหตุการณ์แล้ว');
  }
});

/* ---------- ราคาน้ำมัน ---------- */
function priceChartSvg(monthly) {
  if (!monthly.length) return '<div class="empty">ยังไม่มีข้อมูลราคาในช่วงนี้</div>';
  const W = 326, H = 170, L = 20, R = 315, T = 32, B = 128;
  const vals = monthly.map(m => m.avg), mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const pts = monthly.map((m, i) => ({ x: monthly.length === 1 ? (L + R) / 2 : L + i * (R - L) / (monthly.length - 1), y: B - (m.avg - mn) / span * (B - T), m }));
  const last = pts[pts.length - 1], first = pts[0];
  const up = last.m.avg > first.m.avg;
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="ราคาเฉลี่ยรายเดือน จาก ' + fmt2(first.m.avg) + ' เป็น ' + fmt2(last.m.avg) + ' บาท">' +
    [T, (T + B) / 2, B].map(y => '<line x1="' + L + '" y1="' + y + '" x2="' + R + '" y2="' + y + '" stroke="#F1F5F9"/>').join('') +
    '<polyline points="' + pts.map(p => p.x + ',' + p.y).join(' ') + '" fill="none" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>' +
    pts.map((p, i) => '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (i === pts.length - 1 ? 6 : 4) + '" fill="' + (i === pts.length - 1 ? (up ? '#B91C1C' : '#047857') : '#0F172A') + '"/>').join('') +
    '<text x="' + Math.min(last.x, R) + '" y="' + (last.y - 12) + '" text-anchor="end" font-family="Sarabun" font-size="14" font-weight="700" fill="' + (up ? '#B91C1C' : '#047857') + '">' + fmt2(last.m.avg) + '</text>' +
    (pts.length > 1 ? '<text x="' + first.x + '" y="' + (first.y - 10) + '" font-family="Sarabun" font-size="13" fill="#475569">' + fmt2(first.m.avg) + '</text>' : '') +
    '<g font-family="Sarabun" font-size="12" fill="#475569" text-anchor="middle">' + pts.map(p => '<text x="' + p.x + '" y="160">' + TH_MONTH_SHORT[Number(p.m.month.slice(5, 7)) - 1] + '</text>').join('') + '</g></svg>';
}

/* ============================================================
 * profile.js — ล็อกแอป (PIN + สแกนนิ้ว/ใบหน้า), ข้อมูลของฉัน, ตั้งค่า
 * ============================================================ */

/* ===== สแกนนิ้ว/ใบหน้า (WebAuthn บนเครื่องนี้) ===== */
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0))
};
const Bio = {
  supported: () => !!(window.PublicKeyCredential && navigator.credentials),
  enabled: () => !!Store.get('cred', ''),
  async register() {
    if (!Bio.supported()) throw new Error('เครื่องนี้ไม่รองรับการสแกนนิ้ว/ใบหน้า');
    if (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) throw new Error('ยังไม่ได้ตั้งค่าสแกนนิ้ว/ใบหน้าในมือถือ');
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'เลขาการเงิน' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: 'เจ้าของเครื่อง' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000
    } });
    Store.set('cred', b64u.enc(cred.rawId));
  },
  async verify() {
    const id = Store.get('cred', '');
    if (!id) return false;
    try {
      await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: b64u.dec(id) }], userVerification: 'required', timeout: 60000 } });
      return true;
    } catch (e) { return false; }
  }
};

/* ===== ล็อกแอป ===== */
// ล็อกอัตโนมัติเมื่อไม่ได้ใช้ตามเวลาที่ตั้ง (นาที) · 0 = ไม่ล็อกอัตโนมัติ · ค่าเริ่มต้น 60 นาที
const LOCK_CHOICES = [[5, '5 นาที'], [30, '30 นาที'], [60, '1 ชั่วโมง'], [1440, '1 วัน'], [0, 'ไม่ล็อกอัตโนมัติ']];
const Lock = {
  minutes() { const m = Store.get('lockMin', 60); return Number.isFinite(m) ? m : 60; },
  label() { const m = Lock.minutes(); const c = LOCK_CHOICES.find(x => x[0] === m); return c ? c[1] : m + ' นาที'; },
  // เข้าได้ต้องมีบัตรผ่าน (หรือ API KEY เดิม) และยังไม่หมดเวลา — จำข้ามการปิด/เปิดแอป
  isOpen() {
    if (!Store.get('token', '') && !Store.get('key', '')) return false;
    const last = Number(Store.get('lastActive', 0));
    if (!last) return false;
    const m = Lock.minutes();
    return m === 0 || Date.now() - last < m * 60000;
  },
  touch() { if (Lock.isOpen()) Store.set('lastActive', Date.now()); },
  open() { Store.set('lastActive', Date.now()); },
  close() { Store.del('lastActive'); render(); },

  show(main) {
    main.className = '';
    const me = Store.get('me', {});
    // เครื่องใหม่ยังไม่รู้ว่าตั้ง PIN แล้วหรือยัง → ถามหลังบ้านก่อน
    if (Store.get('hasPin', null) === null) {
      main.innerHTML = '<div class="lock">' + Logo.html(88, 'aria-hidden="true"') + '<div class="s">กำลังเชื่อมต่อ…</div></div>';
      api('ping').then(p => { Store.set('hasPin', !!p.hasPin); Store.set('pinLen', Number(p.pinLength || 6)); render(); })
        .catch(e => { main.innerHTML = '<div class="lock">' + Logo.html(88, 'aria-hidden="true"') + '<div class="err-text" style="text-align:center">' + esc(e.message) + '</div><button class="btn" id="lk_retry">ลองใหม่</button></div>'; $('#lk_retry', main).onclick = () => render(); });
      return;
    }
    const setMode = !Store.get('hasPin', false);
    const hasToken = !!(Store.get('token', '') || Store.get('key', ''));
    let pin = '', first = '';
    const LEN = setMode ? NEW_PIN_LENGTH : pinLen();
    const title = () => setMode ? (first ? 'ใส่ PIN เดิมอีกครั้งเพื่อยืนยัน' : 'ตั้ง PIN ' + LEN + ' หลัก สำหรับเข้าแอป') : 'ใส่ PIN ' + LEN + ' หลักเพื่อเข้าแอป';
    main.innerHTML = '<div class="lock">' + Logo.html(88, 'aria-hidden="true"') +
      '<div style="text-align:center"><div style="font-size:22px;font-weight:700">สวัสดีครับ' + (me.nickname ? ' ' + esc(me.nickname) : '') + '</div><div class="s" id="lk_msg">' + title() + '</div></div>' +
      '<div class="dots" id="lk_dots" role="img" aria-label="ใส่แล้ว 0 จาก ' + LEN + ' หลัก">' + '<span></span>'.repeat(LEN) + '</div>' +
      '<div class="keypad">' + '123456789'.split('').map(k => '<button type="button" data-k="' + k + '">' + k + '</button>').join('') +
      (!setMode && hasToken && Bio.enabled() ? '<button type="button" class="k-bio" id="lk_bio" aria-label="ปลดล็อกด้วยลายนิ้วมือ/ใบหน้า"><span class="ms" aria-hidden="true" style="font-size:34px">fingerprint</span></button>' : '<span></span>') +
      '<button type="button" data-k="0">0</button><button type="button" class="k-del" id="lk_del" aria-label="ลบ"><span class="ms" aria-hidden="true" style="font-size:30px">backspace</span></button></div>' +
      '<div class="s" style="margin-top:auto;text-align:center">ลืม PIN? เปิดหน้า Apps Script แล้วรันฟังก์ชัน resetPin<br>เวอร์ชัน ' + APP_VERSION + '</div></div>';
    const dots = $('#lk_dots', main), msg = $('#lk_msg', main);
    const draw = () => { $$('span', dots).forEach((s, i) => s.classList.toggle('f', i < pin.length)); dots.setAttribute('aria-label', 'ใส่แล้ว ' + pin.length + ' จาก ' + LEN + ' หลัก'); };
    const fail = (text) => { msg.textContent = text; msg.className = 'err-text'; dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); pin = ''; draw(); };
    const done = async () => {
      if (setMode) {
        if (!first) { first = pin; pin = ''; draw(); msg.textContent = title(); return; }
        if (pin !== first) { first = ''; fail('PIN สองครั้งไม่ตรงกัน เริ่มตั้งใหม่'); return; }
        showLoading('กำลังตั้ง PIN…');
        try { const r = await api('setupPin', { pin }); Store.set('token', r.token); Store.set('hasPin', true); Store.set('pinLen', LEN); Lock.open(); toast('ตั้ง PIN แล้ว', 'ok'); render(); } catch (e) { first = ''; fail(e.message); } finally { hideLoading(); }
        return;
      }
      showLoading('กำลังตรวจสอบ…');
      try {
        const r = await api('login', { pin });
        if (r.noPin) { Store.set('hasPin', false); render(); return; }
        if (r.ok) { Store.set('token', r.token); Lock.open(); render(); }
        else fail(r.locked ? r.message : 'PIN ไม่ถูกต้อง · เหลือ ' + r.triesLeft + ' ครั้ง');
      } catch (e) { fail(e.message); } finally { hideLoading(); }
    };
    $$('[data-k]', main).forEach(b => b.onclick = () => { if (pin.length < LEN) { pin += b.dataset.k; draw(); if (pin.length === LEN) done(); } });
    $('#lk_del', main).onclick = () => { pin = pin.slice(0, -1); draw(); };
    const bio = $('#lk_bio', main);
    if (bio) {
      bio.onclick = async () => { if (await Bio.verify()) { Lock.open(); render(); } else toast('สแกนไม่สำเร็จ ใช้ PIN แทน', 'warn'); };
      setTimeout(() => bio.click(), 300); // เปิดสแกนให้อัตโนมัติ
    }
  }
};

/* ===== ยืนยันตัวตนก่อนดูข้อมูลสำคัญ ===== */
async function confirmIdentity() {
  if (Bio.enabled() && await Bio.verify()) return true;
  return new Promise(resolve => {
    sheet('<span class="ms" aria-hidden="true" style="font-size:56px;align-self:center">lock</span><h2 style="text-align:center">ยืนยันตัวตนเพื่อดูข้อมูล</h2>' +
      '<input class="input" id="cf_pin" type="password" inputmode="numeric" maxlength="' + pinLen() + '" autocomplete="off" aria-label="PIN ' + pinLen() + ' หลัก" placeholder="ใส่ PIN ' + pinLen() + ' หลัก" style="text-align:center;font-size:24px;letter-spacing:8px">' +
      '<div class="err-text" id="cf_err"></div><button class="btn" id="cf_ok">ยืนยัน</button><button class="btn ghost" data-close>ยกเลิก</button>', (el, close) => {
      $$('[data-close]', el).forEach(b => b.addEventListener('click', () => resolve(false)));
      const ok = async () => {
        try {
          const r = await api('verifyPin', { pin: $('#cf_pin', el).value });
          if (r.ok) { close(); resolve(true); } else $('#cf_err', el).textContent = r.locked ? r.message : 'PIN ไม่ถูกต้อง';
        } catch (e) { $('#cf_err', el).textContent = e.message; }
      };
      $('#cf_ok', el).onclick = ok;
      $('#cf_pin', el).addEventListener('input', e => { if (e.target.value.length === pinLen()) ok(); });
    });
  });
}

/* ============================================================
 * plans.js — รายการประจำ, บัญชีผ่อน & สะสม, วางแผนออม/โป๊ะหนี้, ยอดยกมา, ประวัติรับราชการ
 * ============================================================ */

/* ---------- ตัวช่วยเดือน/วันที่ ---------- */
function curMonth() { return todayStr().slice(0, 7); }
function monthDiff(a, b) { return (Number(b.slice(0, 4)) - Number(a.slice(0, 4))) * 12 + Number(b.slice(5, 7)) - Number(a.slice(5, 7)); }
function monthInput(id, label, value) {
  return '<div class="fld"><label class="lbl" for="' + id + '">' + esc(label) + '</label><input class="input" type="month" id="' + id + '" value="' + esc(value || '') + '"></div>';
}
// สวิตช์เปิด/ปิด (กดได้ทั้งแถว)
function switchRow(id, title, sub, on) {
  return '<button type="button" class="row" role="switch" id="' + id + '" aria-checked="' + !!on + '"><div class="grow"><div class="t">' + esc(title) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div><span class="sw' + (on ? ' on' : '') + '" aria-hidden="true"></span></button>';
}
function bindSwitch(el, id, onChange) {
  const b = $('#' + id, el);
  if (!b) return;
  b.onclick = () => { const v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', v); $('.sw', b).classList.toggle('on', v); if (onChange) onChange(v); };
}
const swVal = (el, id) => { const b = $('#' + id, el); return !!b && b.getAttribute('aria-checked') === 'true'; };
function rtag(cls, text) { return '<span class="rtag ' + cls + '">' + esc(text) + '</span>'; }

/* ---------- วันเกษียณ อายุ (ข้อมูลของฉัน) ---------- */
// เกษียณ = 30 ก.ย. ของปีงบประมาณที่อายุครบ 60 ปี (อายุครบ = วันก่อนวันเกิด)
function retireDate(birth) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(birth || '')) return '';
  const y = Number(birth.slice(0, 4)), m = Number(birth.slice(5, 7)), d = Number(birth.slice(8, 10));
  const full = new Date(Date.UTC(y + 60, m - 1, d) - 86400000);
  const fy = full.getUTCMonth() <= 8 ? full.getUTCFullYear() : full.getUTCFullYear() + 1;
  return fy + '-09-30';
}
function yearsMonths(from, to) {
  if (!from || !to) return null;
  let months = monthDiff(from.slice(0, 7), to.slice(0, 7));
  if (Number(to.slice(8, 10)) < Number(from.slice(8, 10))) months--;
  months = Math.max(0, months);
  return { y: Math.floor(months / 12), m: months % 12 };
}
function ymText(v) { return v ? v.y + ' ปี' + (v.m ? ' ' + v.m + ' เดือน' : '') : '-'; }
function careerOf(kind) { return (App.data.career || []).filter(c => c.kind === kind).sort((a, b) => String(b.fromDate).localeCompare(String(a.fromDate))); }
function retireMonth() { const r = retireDate((App.data.settings || {}).birthDate); return r ? r.slice(0, 7) : ''; }

/* ---------- ยอดของรายการประจำ ---------- */
const RC_MODES = { fixed: ['ยอดคงที่', 'lock'], variable: ['ไม่แน่นอน', 'edit'], multi: ['หลายครั้ง/เดือน', 'repeat'], lastMonth: ['ยอดเดือนก่อน', 'history'] };
function rcMode(r) { return RC_MODES[r.amountMode] ? r.amountMode : 'fixed'; }
function rcTags(r) {
  const out = [];
  if (isOn(r.deductFromSalary)) out.push(rtag('ded', 'หักเงินเดือน'));
  if (r.triggerId) { const t = (App.data.recurring || []).find(x => x.id === r.triggerId); out.push(rtag('link', 'ตาม' + (t ? t.title.split(' ')[0] : 'รายการอื่น'))); }
  const m = rcMode(r);
  if (m === 'variable') out.push(rtag('var', 'ไม่แน่นอน'));
  if (m === 'multi') out.push(rtag('multi', 'หลายครั้ง'));
  if (m === 'lastMonth') out.push(rtag('card', 'ยอดเดือนก่อน'));
  return out.join('');
}
function rcTitle(r) {
  if (!isOn(r.isSalary)) return r.title;
  const step = careerOf('salary').find(c => String(c.fromDate).slice(0, 7) <= App.month);
  return step && r.title.indexOf(step.title) < 0 ? r.title + ' ' + step.title : r.title;
}
function rcCut(r) { return !isActive(r.active) || (r.endMonth && String(r.endMonth) <= curMonth()); }

/* ---------- รอยืนยัน (หน้ารายการเดือนนี้) ---------- */
function pendingHtml() {
  const all = App.data.pendingRecurring || [];
  const salary = all.filter(r => isOn(r.isSalary));
  const deds = all.filter(r => isOn(r.deductFromSalary));
  // ซ่อน: รายการที่ทำตามรายการอื่น (ถามตอนยืนยัน) และรายการหักเงินเดือน (อยู่ในการ์ดเงินเดือน)
  const show = all.filter(r => !r.triggerId && !(isOn(r.deductFromSalary) && salary.length));
  const confirmed = (App.data.transactions || []).filter(t => t.recurringId && !t.groupId);
  if (!show.length && !confirmed.length) return '<a class="btn ghost" href="#/recurring"><span class="ms" aria-hidden="true">tune</span>จัดการรายการประจำ</a>';
  const days = {};
  show.forEach(r => { const d = num(r.dayOfMonth) || 1; (days[d] = days[d] || []).push(r); });
  const btn = (r) => {
    const m = rcMode(r);
    if (m === 'multi') return '<button class="icb outline" data-multi="' + esc(r.id) + '" aria-label="บันทึก ' + esc(r.title) + ' เพิ่ม"><span class="ms" aria-hidden="true">add</span></button>';
    if (m === 'variable' || m === 'lastMonth') return '<button class="icb outline warnline" data-ask="' + esc(r.id) + '" aria-label="กรอกยอดแล้วยืนยัน ' + esc(r.title) + '"><span class="ms" aria-hidden="true">edit</span></button>';
    return '<button class="icb outline" data-confirm="' + esc(r.id) + '" aria-label="ยืนยัน ' + esc(r.title) + '"><span class="ms" aria-hidden="true">check</span></button>';
  };
  const rowOf = (r) => {
    const k = typeKind(r.type), m = rcMode(r);
    let sub = m === 'multi' ? 'บันทึกได้หลายครั้ง · เดือนนี้ ' + (r.doneCount || 0) + ' ครั้ง' : m === 'lastMonth' ? 'ยอด ' + (r.sourceCategory || '') + ' เดือน ' + thMonth(addMonth(App.month, -1), true) : m === 'variable' ? 'ยอดตั้งต้น · กรอกยอดจริงตอนยืนยัน' : (r.category || r.type);
    let extra = '';
    if (isOn(r.isSalary) && deds.length) {
      const dsum = deds.reduce((s, d) => s + num(d.amount), 0);
      extra = '<div class="dedbox">' + deds.map(d => '<div class="kv"><span>− ' + esc(d.title) + '</span><b class="' + typeKind(d.type) + '">' + fmt(d.amount) + '</b></div>').join('') +
        '<div class="kv total"><span>รับเข้าบัญชีจริง</span><b class="in">' + fmt(num(r.amount) - dsum) + '</b></div></div>';
      sub = 'ก่อนหัก ' + fmt(r.amount);
    }
    const linked = (App.data.recurring || []).filter(x => x.triggerId === r.id && !rcCut(x));
    if (linked.length) extra += '<div class="linkhint"><span class="ms" aria-hidden="true">link</span>ยืนยันแล้วจะถาม: ' + esc(linked.map(x => x.title + ' ' + fmt(x.amount)).join(', ')) + '</div>';
    return '<div class="row" style="align-items:flex-start"><div class="ic"><span class="ms" aria-hidden="true">' + catIcon(r.type, r.category) + '</span></div><div class="grow"><div class="t">' + esc(rcTitle(r)) + ' ' + rcTags(r) + '</div><div class="s">' + esc(sub) + '</div>' + extra + '</div>' +
      '<div class="amt ' + k + '">' + (m === 'variable' ? '~' : '') + money(num(r.amount), k) + '</div>' + btn(r) + '</div>';
  };
  const confirmable = show.filter(r => ['fixed'].indexOf(rcMode(r)) >= 0);
  return (show.length ? '<div class="box warnbox"><div class="hd"><h2 class="warn">รอยืนยัน (' + show.length + ')</h2>' + (confirmable.length ? '<button class="btn sm" id="confirmAll">ยืนยันยอดคงที่ทั้งหมด</button>' : '') + '</div>' +
    Object.keys(days).sort((a, b) => a - b).map(d => '<div class="daygrp"><span class="ms" aria-hidden="true">event</span>วันที่ ' + d + '</div>' + days[d].map(rowOf).join('')).join('') + '</div>' : '') +
    (confirmed.length ? '<div class="box"><div class="hd"><h2 class="in">ยืนยันแล้ว (' + confirmed.length + ')</h2><button class="btn sm ghost dangerline" id="resetMonth"><span class="ms" aria-hidden="true">restart_alt</span>รีเซ็ตทั้งเดือน</button></div>' +
      txSorted(confirmed).map(t => {
        const kids = (App.data.transactions || []).filter(x => x.groupId && x.groupId === t.recurringId);
        return '<div class="row"><div class="ic"><span class="ms" aria-hidden="true">' + catIcon(t.type, t.category) + '</span></div><div class="grow"><div class="t">' + esc(t.title) + '</div><div class="s">' + thDate(t.date) + (kids.length ? ' · พร้อม ' + esc(kids.map(k => k.title).join(', ')) : '') + '</div></div>' +
          '<div class="amt ' + typeKind(t.type) + '">' + money(num(t.amount), typeKind(t.type)) + '</div><button class="icb outline dangerline" data-undo="' + esc(t.id) + '" aria-label="ยกเลิกการยืนยัน ' + esc(t.title) + '"><span class="ms" aria-hidden="true">undo</span></button></div>';
      }).join('') + '</div>' : '') +
    '<a class="btn ghost" href="#/recurring"><span class="ms" aria-hidden="true">tune</span>จัดการรายการประจำ</a>';
}

// ขอยอดจริง (และวันที่) ก่อนยืนยัน — คืนค่า {amount, date} หรือ null
function askAmount(r, title) {
  return new Promise(resolve => {
    const dd = Math.min(num(r.dayOfMonth) || 1, 28);
    sheet('<h2>' + esc(title || rcTitle(r)) + '</h2>' + field('aa_amt', 'ยอด (บาท)', num(r.amount) || '', 'inputmode="decimal"') + dateField('aa_date', 'วันที่', App.month === curMonth() && rcMode(r) === 'multi' ? todayStr() : App.month + '-' + pad2(dd)) +
      '<button class="btn" id="aa_ok">ยืนยัน</button><button class="btn ghost" data-close>ยกเลิก</button>', (el, close) => {
      $$('[data-close]', el).forEach(b => b.addEventListener('click', () => resolve(null)));
      $('#aa_ok', el).onclick = () => {
        const amount = num($('#aa_amt', el).value);
        if (amount <= 0) { toast('กรุณากรอกยอด', 'err'); return; }
        close(); resolve({ amount, date: $('#aa_date', el).value });
      };
    });
  });
}

// ยืนยัน แล้วถามรายการที่ผูกไว้ (เช่น ยืนยันโอที → ถามโอนแชร์)
async function confirmRecurringItems(items, btn) {
  await busy(btn, async () => { await api('confirmRecurring', { month: App.month, items }); }, 'ยืนยันแล้ว');
  for (const it of items) {
    const linked = (App.data.recurring || []).filter(x => x.triggerId === it.id && !rcCut(x));
    for (const x of linked) {
      const amt = num((App.data.pendingRecurring || []).find(p => p.id === x.id)?.amount ?? x.amount);
      if (await confirmBox('ยืนยัน "' + x.title + '" ' + fmt(amt) + ' บาท ด้วยไหม?', 'ยืนยันด้วย')) {
        try { await api('confirmRecurring', { month: App.month, items: [{ id: x.id, groupId: it.id, date: it.date }] }); toast('ยืนยัน ' + x.title + ' แล้ว'); } catch (e) { toast(e.message, 'err'); }
      }
    }
  }
  await refresh(); render(true);
}

function mountPending(el) {
  const find = (id) => (App.data.pendingRecurring || []).find(r => r.id === id);
  $$('[data-confirm]', el).forEach(b => b.onclick = () => confirmRecurringItems([{ id: b.dataset.confirm }], b).catch(() => {}));
  $$('[data-ask]', el).forEach(b => b.onclick = async () => {
    const r = find(b.dataset.ask); const v = await askAmount(r);
    if (v) confirmRecurringItems([{ id: r.id, amount: v.amount, date: v.date }], b).catch(() => {});
  });
  $$('[data-multi]', el).forEach(b => b.onclick = async () => {
    const r = find(b.dataset.multi); const v = await askAmount(r, 'บันทึก ' + r.title + ' (ครั้งที่ ' + ((r.doneCount || 0) + 1) + ')');
    if (v) confirmRecurringItems([{ id: r.id, amount: v.amount, date: v.date }], b).catch(() => {});
  });
  const all = $('#confirmAll', el);
  if (all) all.onclick = () => {
    const salary = (App.data.pendingRecurring || []).some(r => isOn(r.isSalary));
    const items = (App.data.pendingRecurring || []).filter(r => !r.triggerId && rcMode(r) === 'fixed' && !(salary && isOn(r.deductFromSalary))).map(r => ({ id: r.id }));
    confirmRecurringItems(items, all).catch(() => {});
  };
  $$('[data-undo]', el).forEach(b => b.onclick = async () => {
    const t = (App.data.transactions || []).find(x => x.id === b.dataset.undo);
    const kids = (App.data.transactions || []).filter(x => x.groupId && x.groupId === t.recurringId);
    const msg = 'ยกเลิกการยืนยัน "' + t.title + '"?' + (kids.length ? ' (' + kids.map(k => k.title).join(', ') + ' จะยกเลิกด้วย)' : '');
    if (!await confirmBox(msg, 'ยกเลิกการยืนยัน', true)) return;
    busy(b, async () => { await api('undoRecurring', { txId: t.id }); await refresh(); render(true); }, 'ยกเลิกแล้ว กลับไปอยู่ในรอยืนยัน').catch(() => {});
  });
  const rs = $('#resetMonth', el);
  if (rs) rs.onclick = async () => {
    if (!await confirmBox('รีเซ็ตรายการประจำทั้งเดือน ' + thMonth(App.month) + '? ทุกรายการที่ยืนยันแล้วจะกลับไปรอยืนยัน', 'รีเซ็ต', true)) return;
    busy(rs, async () => { await api('resetRecurringMonth', { month: App.month }); await refresh(); render(true); }, 'รีเซ็ตแล้ว').catch(() => {});
  };
}

/* ---------- คำนวณบัญชีผ่อน/สะสม ---------- */
const PLAN_TYPES = { installment: ['ผ่อน', 'shopping_bag', 'หนี้สิน'], loan: ['หนี้มีดอกเบี้ย', 'credit_score', 'หนี้สิน'], saving: ['ออมสะสม', 'savings', 'ทรัพย์สิน'], share: ['แชร์', 'groups', 'ทรัพย์สิน'], invest: ['ลงทุน', 'trending_up', 'ทรัพย์สิน'] };
const PAY_BY = { salary: 'หักเงินเดือน', transfer: 'โอน', card: 'บัตรเครดิต' };
function planList(a) { try { const x = JSON.parse(a.plan || '[]'); return Array.isArray(x) ? x.filter(p => p.month && num(p.amount) > 0).sort((p, q) => p.month.localeCompare(q.month)) : []; } catch (e) { return []; } }
function planTx(a) { return (App.data.accountTx || []).filter(t => t.accountId === a.id).sort((x, y) => String(x.date).localeCompare(String(y.date))); }

// ตารางผ่อนหนี้ (ต้นคงที่+ดอก หรือ งวดเท่ากัน) พร้อมแผนโป๊ะ
function loanSchedule(a, withPlan) {
  const rate = num(a.interestRate) / 100 / 12, per = num(a.perPeriod), mode = a.loanMode === 'annuity' ? 'annuity' : 'fixed';
  const extra = {}; if (withPlan) planList(a).forEach(p => { extra[p.month] = (extra[p.month] || 0) + num(p.amount); });
  let bal = num(a.totalAmount), m = a.openingMonth || a.startMonth || curMonth();
  const rows = [];
  for (let i = 0; i < 720 && bal > 0.009; i++) {
    const interest = round2(bal * rate);
    let principal = mode === 'annuity' ? Math.max(0, per - interest) : per;
    if (principal <= 0 && !extra[m]) { rows.push({ month: m, before: bal, principal: 0, interest, extra: 0, after: bal, stuck: true }); break; }
    principal = Math.min(principal, bal);
    const ex = Math.min(extra[m] || 0, bal - principal);
    const after = round2(bal - principal - ex);
    rows.push({ month: m, before: bal, principal: round2(principal), interest, extra: round2(ex), after });
    bal = after; m = addMonth(m, 1);
  }
  return rows;
}

// ยอดออมจนเกษียณ (ปันผลคิดทบต้นรายเดือนแบบประมาณ)
function savingProjection(a, balanceNow, withPlan) {
  const end = retireMonth();
  if (!end) return null;
  const rate = num(a.dividendRate) / 100 / 12, plan = withPlan ? planList(a) : [];
  const paidThis = planTx(a).some(t => t.month === curMonth());
  let m = paidThis ? addMonth(curMonth(), 1) : curMonth(), bal = balanceNow, put = 0, div = 0;
  const series = [{ m, v: bal }];
  while (m <= end && series.length < 600) {
    const p = plan.filter(x => x.month <= m).pop();
    const amt = p ? num(p.amount) : num(a.perPeriod);
    const d = bal * rate;
    bal += amt + d; put += amt; div += d;
    if (m.slice(5) === '12' || m === end) series.push({ m, v: bal });
    m = addMonth(m, 1);
  }
  return { total: round2(bal), put: round2(put), dividend: round2(div), series, end };
}

function planCalc(a) {
  const tx = planTx(a), cm = curMonth();
  const txSum = tx.reduce((s, t) => s + num(t.amount), 0);
  const paidThisMonth = tx.some(t => t.month === cm);
  const t = a.planType, per = num(a.perPeriod);
  const o = { a, tx, txSum, paidThisMonth, type: t };
  if (t === 'installment' || t === 'share') {
    o.periods = num(a.periods);
    o.paid = num(a.paidPeriodsStart) + tx.length;
    o.paidAmount = (num(a.paidAmountStart) || num(a.paidPeriodsStart) * per) + txSum;
    o.total = num(a.totalAmount) || o.periods * per;
    o.left = Math.max(0, o.periods - o.paid);
    o.remaining = Math.max(0, round2(o.total - o.paidAmount));
    o.pct = o.periods ? Math.min(100, Math.round(o.paid / o.periods * 100)) : 0;
    o.endMonth = o.left > 0 ? addMonth(cm, o.left - (paidThisMonth ? 0 : 1)) : (tx.length ? tx[tx.length - 1].month : cm);
    o.due = o.left > 0 && !paidThisMonth ? per : 0;
    o.value = t === 'share' ? o.paidAmount : o.remaining;
  } else if (t === 'loan') {
    const rows = loanSchedule(a, true), base = loanSchedule(a, false);
    const now = rows.find(r => r.month === cm) || (rows.length && rows[0].month > cm ? rows[0] : null);
    o.rows = rows; o.base = base;
    o.principal = now ? now.before : (rows.length ? 0 : num(a.totalAmount));
    o.dueRow = rows.find(r => r.month === cm);
    o.due = o.dueRow && !paidThisMonth ? round2(o.dueRow.principal + o.dueRow.interest) : 0;
    o.endMonth = rows.length ? rows[rows.length - 1].month : cm;
    o.baseEnd = base.length ? base[base.length - 1].month : cm;
    o.interestTotal = round2(rows.reduce((s, r) => s + r.interest, 0));
    o.interestSaved = round2(base.reduce((s, r) => s + r.interest, 0) - o.interestTotal);
    o.stuck = rows.some(r => r.stuck);
    o.pct = num(a.totalAmount) ? Math.min(100, Math.round((1 - o.principal / num(a.totalAmount)) * 100)) : 0;
    o.value = o.principal;
  } else {
    o.balance = round2(num(a.paidAmountStart) + txSum);
    o.count = num(a.paidPeriodsStart) + tx.length;
    o.due = !paidThisMonth ? per : 0;
    o.proj = savingProjection(a, o.balance, true);
    o.projBase = savingProjection(a, o.balance, false);
    o.value = o.balance;
    o.pct = 100;
  }
  return o;
}
// มูลค่าที่ใช้ในหน้า ทรัพย์สิน/หนี้สิน (บัญชีที่ตั้งแผนไว้ คำนวณให้อัตโนมัติ)
function accValue(a) { return a.planType && !isOn(a.closed) ? planCalc(a).value : num(a.value); }

function planRowHtml(a) {
  const c = planCalc(a), debt = a.planType === 'installment' || a.planType === 'loan';
  const kind = debt ? 'out' : 'sav', color = debt ? '#B91C1C' : '#1D4ED8';
  let line = '', right = '', sub2 = '';
  if (a.planType === 'installment') { line = 'งวด ' + c.paid + '/' + c.periods + ' · หมด ' + thMonth(c.endMonth, true); right = 'เหลือ ' + fmt(c.remaining, 0); sub2 = c.left ? (c.due ? 'เดือนนี้ ' + fmt(c.due) : 'เดือนนี้จ่ายแล้ว ✓') : 'ผ่อนครบแล้ว'; }
  else if (a.planType === 'share') { line = 'ส่งแล้ว ' + c.paid + '/' + c.periods + ' ครั้ง'; right = 'ส่ง ' + fmt(c.paidAmount, 0); sub2 = 'เหลือ ' + c.left + ' ครั้ง (' + fmt(c.remaining, 0) + ')'; }
  else if (a.planType === 'loan') { line = 'หมด ' + thMonth(c.endMonth, true) + (num(a.interestRate) ? ' · ดอก ' + fmt(a.interestRate) + '%' : ''); right = 'เหลือ ' + fmt(c.principal, 0); sub2 = c.due ? 'เดือนนี้ ' + fmt(c.due) : (c.paidThisMonth ? 'เดือนนี้จ่ายแล้ว ✓' : '-'); }
  else { line = 'ส่งแล้ว ' + c.count + ' ครั้ง'; right = 'สะสม ' + fmt(c.balance, 0); sub2 = 'เดือนละ ' + fmt(a.perPeriod); }
  return '<a class="row" href="#/plan?id=' + encodeURIComponent(a.id) + '" style="align-items:flex-start"><div class="ic"><span class="ms" aria-hidden="true">' + PLAN_TYPES[a.planType][1] + '</span></div><div class="grow" style="display:flex;flex-direction:column;gap:6px">' +
    '<div class="row-flex" style="justify-content:space-between"><div class="t">' + esc(a.name) + ' ' + (a.payBy ? rtag(a.payBy === 'salary' ? 'ded' : a.payBy === 'card' ? 'card' : 'var', PAY_BY[a.payBy]) : '') + '</div><div class="amt ' + kind + '" style="font-size:16px">' + right + '</div></div>' +
    '<div class="bar"><div style="width:' + c.pct + '%;background:' + color + '"></div></div><div class="s row-flex" style="justify-content:space-between"><span>' + esc(line) + '</span><span>' + esc(sub2) + '</span></div></div></a>';
}

function projChart(c) {
  const a = c.proj, b = c.projBase;
  if (!a || a.series.length < 2) return '';
  const max = Math.max(...a.series.map(p => p.v), ...b.series.map(p => p.v)) || 1, n = a.series.length - 1;
  const pts = (s) => s.map((p, i) => (i / n * 320 + 10).toFixed(1) + ',' + (110 - p.v / max * 100).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 340 120" width="100%" height="120" role="img" aria-label="กราฟยอดสะสมจนเกษียณ ตามแผน ' + fmt(a.total, 0) + ' บาท ออมเท่าเดิม ' + fmt(b.total, 0) + ' บาท">' +
    '<polyline points="' + pts(b.series) + '" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 5"/><polyline points="' + pts(a.series) + '" fill="none" stroke="#1D4ED8" stroke-width="3"/></svg>' +
    '<div class="s row-flex" style="gap:16px;padding:0 16px 12px"><span><b style="color:#1D4ED8">━</b> ตามแผน</span><span><b style="color:#94A3B8">┅</b> ออมเท่าเดิม</span></div>';
}

}

      if (pumps.some(x => x.liters !== '' && !x.costPerLiter)) throw new Error('กรุณากรอกต้นทุน/ลิตร ของตู้ที่กรอกลิตรคงเหลือ');
      const cards = D.activeCards().map(c => ({ cardId: c.id, points: val('op_p_' + c.id) })).filter(x => x.points !== '');

      if (!pumps.length && !cards.length && !accounts.length) throw new Error('ยังไม่ได้กรอกยอดใดเลย');
      await api('saveOpening', { date, pumps, cards, accounts });
      await refresh(); go('#/home');
    }, 'บันทึกยอดยกมาแล้ว').catch(() => {});

});

const CAREER_KINDS = { rank: ['ยศ', 'military_tech'], position: ['ตำแหน่ง', 'work'], salary: ['ขั้นเงินเดือน', 'payments'], decoration: ['เครื่องราชฯ', 'workspace_premium'] };
function careerHtml() {
  const s = App.data.settings || {};
  const rank = careerOf('rank')[0], pos = careerOf('position')[0];
  const today = todayStr(), ret = retireDate(s.birthDate);
  const age = yearsMonths(s.birthDate, today), svc = yearsMonths(s.serviceDate, today), left = ret ? yearsMonths(today, ret) : null;
  const name = [rank ? rank.title : '', s.firstName, s.lastName].filter(Boolean).join(' ');
  const tl = (kind) => {
    const list = careerOf(kind);
    const salaryHint = kind === 'salary' && (App.data.recurring || []).some(r => isOn(r.isSalary)) ? '<div class="linkhint" style="margin:0 16px 8px"><span class="ms" aria-hidden="true">link</span>ผูกกับรายการประจำ "เงินเดือน" อัตโนมัติ</div>' : '';

      (list.length ? list.map((c, i) => {
        const next = kind === 'decoration' && num(c.yearsToNext) ? ' · ขอชั้นถัดไปได้ ' + (Number(String(c.fromDate).slice(0, 4)) + num(c.yearsToNext) + 543) : '';
        const until = i ? ' – ' + thDate(list[i - 1].fromDate) : '';
        return '<button class="tl" data-editc="' + esc(c.id) + '"><span class="dot' + (i ? '' : ' now') + '"></span><span class="grow"><span class="t">' + esc(c.title) + (kind === 'salary' && num(c.amount) ? ' · ' + fmt(c.amount) : '') + '</span><span class="s">' + (i ? thDate(c.fromDate) + until : 'ตั้งแต่ ' + thDate(c.fromDate)) + next + (c.note ? ' · ' + esc(c.note) : '') + '</span></span></button>';
      }).join('') : '<div class="empty">ยังไม่มี</div>') + '</div>';
  };
  return '<div class="box pad row-flex" style="gap:14px"><div style="position:relative;flex:none">' + avatarHtml(72, s.photoUrl, 'role="img" aria-label="รูปโปรไฟล์"') +
    '<button class="icb" id="pf_photo" aria-label="เปลี่ยนรูป" style="position:absolute;right:-6px;bottom:-6px;width:34px;height:34px;border:3px solid #fff;background:#0F172A;color:#fff"><span class="ms" aria-hidden="true" style="font-size:18px">photo_camera</span></button></div>' +
    '<div class="grow" style="min-width:0"><div style="font-size:19px;font-weight:700">' + esc(name || s.nickname || 'ใส่ยศ ชื่อ นามสกุล') + '</div><div class="s">' + esc([pos ? pos.title : '', s.unitName].filter(Boolean).join(' · ') || 'ยังไม่ระบุตำแหน่ง') + '</div></div>' +
    '<button class="icb outline" id="pf_me" aria-label="แก้ไขข้อมูลส่วนตัว"><span class="ms" aria-hidden="true">edit</span></button></div>' +
    '<div class="box pad grid3" style="text-align:center"><div><div class="s">อายุ</div><div class="amt">' + (age ? age.y + ' ปี' : '-') + '</div></div><div><div class="s">อายุราชการ</div><div class="amt">' + (svc ? svc.y + ' ปี' : '-') + '</div></div><div><div class="s">เกษียณ</div><div class="amt warn">' + (ret ? thDate(ret) : '-') + '</div></div></div>' +
    '<div class="box pad"><div class="kv"><span>วันเกิด</span><b>' + (s.birthDate ? thDate(s.birthDate) : '-') + '</b></div><div class="kv"><span>บรรจุรับราชการ</span><b>' + (s.serviceDate ? thDate(s.serviceDate) : '-') + '</b></div>' +
    '<div class="kv"><span>อายุราชการ</span><b>' + ymText(svc) + '</b></div><div class="kv"><span>เหลือก่อนเกษียณ</span><b class="warn">' + ymText(left) + '</b></div></div>' +

}

      await refresh(); close(); (done || (() => render(true)))();

function editCareer(c, done) {
  const k = c.kind, label = CAREER_KINDS[k][0];
  const ph = { rank: 'เช่น ด.ต.', position: 'เช่น ผบ.หมู่ งานธุรการ', salary: 'เช่น ส1(23)', decoration: 'เช่น บ.ม.' }[k];
  sheet('<h2>' + (c.id ? 'แก้ไข' : 'เพิ่ม') + label + '</h2>' + field('cr_t', label, c.title || '', 'placeholder="' + ph + '"') + dateField('cr_d', k === 'salary' ? 'มีผลตั้งแต่' : k === 'decoration' ? 'วันที่ได้รับ' : 'ตั้งแต่วันที่', c.fromDate || todayStr()) +
    (k === 'salary' ? field('cr_a', 'เงินเดือน (บาท)', c.amount || '', 'inputmode="decimal"') + '<div class="s">รายการประจำ "เงินเดือน" จะใช้ยอดนี้ตั้งแต่เดือนที่มีผล</div>' : '') +
    (k === 'decoration' ? field('cr_y', 'ครองชั้นนี้กี่ปี จึงขอชั้นถัดไปได้ (ตั้งเอง)', c.yearsToNext || '', 'inputmode="numeric"') : '') +
    field('cr_n', 'หมายเหตุ', c.note || '') + '<button class="btn" id="cr_s">บันทึก</button>' + (c.id ? '<button class="btn danger" id="cr_del">ลบ</button>' : '') + '<button class="btn ghost" data-close>ยกเลิก</button>', (el, close) => {
    $('#cr_s', el).onclick = (e) => busy(e.currentTarget, async () => {
      const title = $('#cr_t', el).value.trim();
      if (!title) throw new Error('กรุณากรอก' + label);
      const rec = { id: c.id || '', kind: k, title, fromDate: $('#cr_d', el).value, note: $('#cr_n', el).value };
      if (k === 'salary') { rec.amount = num($('#cr_a', el).value); if (rec.amount <= 0) throw new Error('กรุณากรอกเงินเดือน'); }
      if (k === 'decoration') rec.yearsToNext = num($('#cr_y', el).value);
      await api('saveRecord', { table: 'Career', record: rec });
      await refresh(); close(); (done || (() => render(true)))();
    }, 'บันทึกแล้ว').catch(() => {});
    const del = $('#cr_del', el);
    if (del) del.onclick = () => busy(del, async () => { await api('deleteRecord', { table: 'Career', id: c.id }); await refresh(); close(); (done || (() => render(true)))(); }, 'ลบแล้ว').catch(() => {});
  });
}
function mountCareer(el) {
  const me = $('#pf_me', el); if (me) me.onclick = () => editMe();
  $$('[data-addc]', el).forEach(b => b.onclick = () => editCareer({ kind: b.dataset.addc }));
  $$('[data-editc]', el).forEach(b => b.onclick = () => editCareer((App.data.career || []).find(c => c.id === b.dataset.editc)));
}

      '<div style="display:flex;flex-direction:column;gap:8px">' + LOCK_CHOICES.map(([m, t]) => '<button type="button" class="chip' + (m === Lock.minutes() ? ' on' : '') + '" data-min="' + m + '">' + t + '</button>').join('') + '</div>' +
      '<button type="button" class="btn ghost" data-close>ยกเลิก</button>', (sh, close) => {
      $$('[data-min]', sh).forEach(b => b.onclick = () => busy(b, async () => {
        const m = Number(b.dataset.min);
        await api('saveSettings', { values: { lockMinutes: m } });
        Store.set('lockMin', m); Lock.open(); close(); render(true);
      }, 'ตั้งค่าแล้ว').catch(() => {}));
    });
  }
});
</script>
<script>
// ใช้โลโก้ที่เก็บไว้ในเครื่องทันทีที่เปิดแอป
try { Logo.apply(); } catch (e) { /* ข้าม */ }
// ลงทะเบียน Service Worker เพื่อให้ติดตั้งเป็นแอปบนมือถือได้
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
