<!doctype html>
<!-- ===== index.html เวอร์ชัน 1.7.0 (24 พ.ย. 69) — ต้องตรงกับ Code.gs เวอร์ชันเดียวกัน =====
     ไฟล์นี้ไฟล์เดียว อัปโหลดขึ้น GitHub (หน้าเว็บ) ทั้ง CSS และ JavaScript อยู่ในไฟล์นี้แล้ว -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เลขาการเงิน">
<title>เลขาการเงิน</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet">
<style>
/* ===== Design system: ขาว-เทา-ดำ + สีความหมาย 4 สี ===== */
:root {
  --ink: #0F172A; --ink2: #334155; --muted: #475569; --line: #E2E8F0; --line2: #F1F5F9; --bg: #F8FAFC; --card: #FFFFFF;
  --in: #047857; --in-bg: #ECFDF5;      /* เขียว = เงินเข้า กำไร ทรัพย์สิน */
  --out: #B91C1C; --out-bg: #FEF2F2;    /* แดง = เงินออก หนี้ ราคาขึ้น */
  --sav: #1D4ED8; --sav-bg: #EFF6FF;    /* น้ำเงิน = ออม ลงทุน */
  --warn: #B45309; --warn-bg: #FFFBEB; --warn-line: #FCD34D; /* ส้ม = ต้องดู */
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Sarabun, system-ui, sans-serif; font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
a { color: var(--ink); }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }
main { padding: 12px 16px calc(100px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; outline: none; }
main.form { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
.ms { font-family: 'Material Symbols Rounded'; font-weight: 400; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
h1 { margin: 0; font-size: 21px; font-weight: 700; }
h2 { margin: 0; font-size: 17px; font-weight: 700; }
.s { font-size: 14px; color: var(--muted); }
.t { font-size: 16px; font-weight: 600; }
.amt { font-size: 17px; font-weight: 700; white-space: nowrap; }
.in { color: var(--in); } .out { color: var(--out); } .sav { color: var(--sav); } .warn { color: var(--warn); } .ink { color: var(--ink); }
.big { font-size: 40px; font-weight: 700; line-height: 1.1; }
.row-flex { display: flex; align-items: center; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

/* ===== กล่อง/แถว ===== */
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.box.pad { padding: 16px; }
.box.warnbox { border-color: var(--warn-line); }
.hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; gap: 8px; }
.warnbox .hd { background: var(--warn-bg); border-radius: var(--r) var(--r) 0 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line2); text-decoration: none; color: var(--ink); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t, .row .s { overflow: hidden; text-overflow: ellipsis; }
.ic { width: 40px; height: 40px; border-radius: 20px; background: var(--line2); color: var(--ink2); display: flex; align-items: center; justify-content: center; flex: none; }
.chev { color: #94A3B8; }
.empty { padding: 20px 16px; text-align: center; color: var(--muted); }
.tag { padding: 2px 10px; border-radius: 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.tag.out { background: var(--out-bg); } .tag.warn { background: var(--warn-bg); } .tag.in { background: var(--in-bg); }
.ai-tag { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding: 1px 8px; border-radius: 8px; background: var(--line2); color: var(--ink2); font-size: 12px; font-weight: 700; }
.ai-tag .ms { font-size: 14px; }

/* ===== ปุ่ม ===== */
.btn { min-height: 56px; width: 100%; border: 0; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; padding: 0 16px; }
.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid #CBD5E1; }
.btn.danger { background: #fff; color: var(--out); min-height: 48px; font-size: 16px; }
.btn.sm { min-height: 44px; font-size: 15px; width: auto; border-radius: 12px; }
.btn:disabled { opacity: .55; }
/* ===== รายการประจำ / บัญชีผ่อน / ประวัติ ===== */
.rtag { display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; white-space: nowrap; vertical-align: 2px; }
.rtag.ded { background: var(--warn-bg); color: var(--warn); } .rtag.var { background: var(--line2); color: var(--ink2); } .rtag.multi { background: var(--sav-bg); color: var(--sav); }
.rtag.card { background: var(--out-bg); color: var(--out); } .rtag.link { background: var(--in-bg); color: var(--in); }
.row .t .rtag { font-weight: 700; }
.sw { width: 52px; height: 30px; border-radius: 15px; background: #CBD5E1; position: relative; flex: none; transition: background .15s; }
.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: left .15s; }
.sw.on { background: var(--in); } .sw.on::after { left: 25px; }
.daygrp { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line); font-size: 14px; font-weight: 700; color: var(--ink2); }
.daygrp .ms { font-size: 20px; }
.dedbox { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 3px 0; } .kv > span { color: var(--muted); } .kv b { font-weight: 700; text-align: right; }
.kv.total { border-top: 1px dashed #CBD5E1; margin-top: 4px; padding-top: 6px; } .kv.total > span { color: var(--ink); font-weight: 700; }
.linkhint { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--in-bg); color: var(--in); font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.linkhint .ms { font-size: 18px; }
.icb.warnline { border-color: var(--warn); color: var(--warn); } .dangerline { color: var(--out) !important; border-color: #FECACA !important; }
.sched { padding: 0 16px 8px; font-size: 14px; } .sched > div { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.2fr; gap: 4px; padding: 6px 0; border-top: 1px solid var(--line2); }
.sched > div > span:not(:first-child) { text-align: right; } .sched .sh { color: var(--muted); font-weight: 700; border-top: 0; }
.sched .now { background: var(--warn-bg); font-weight: 700; } .sched .pre { background: var(--in-bg); }
.tl { display: flex; gap: 12px; padding: 10px 16px; border: 0; border-top: 1px solid var(--line2); background: none; width: 100%; text-align: left; cursor: pointer; color: var(--ink); }
.tl .grow { display: flex; flex-direction: column; } .tl .dot { width: 12px; height: 12px; border-radius: 6px; background: #CBD5E1; margin-top: 6px; flex: none; } .tl .dot.now { background: var(--in); }
.num { width: 36px; height: 36px; border-radius: 18px; background: var(--sav-bg); color: var(--sav); font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.num.off { background: var(--line2); color: #94A3B8; }
.sec { font-size: 14px; font-weight: 700; color: var(--muted); padding: 4px 2px 0; }
.infobox, .calcbox { padding: 12px 14px; border-radius: 12px; background: var(--sav-bg); color: var(--ink2); font-size: 15px; display: flex; gap: 8px; }
.infobox .ms { color: var(--sav); } .calcbox { flex-direction: column; gap: 4px; } .calcbox:empty { display: none; }
.input.sm { height: 46px; font-size: 16px; }
details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
/* ===== โลโก้แอป + หน้าครอป ===== */
.applogo { border-radius: 22%; object-fit: cover; flex: none; display: block; }
.crop { position: fixed; inset: 0; z-index: 60; background: var(--ink); color: #fff; display: flex; flex-direction: column; }
.crop-top { height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
.crop-top h2 { margin: 0; font-size: 19px; }
.crop-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 24px; }
.crop-frame { position: relative; touch-action: none; cursor: grab; }
.crop-frame canvas { display: block; border-radius: 22%; }
.crop-frame::after { content: ''; position: absolute; inset: 0; border: 3px solid #fff; border-radius: 22%; pointer-events: none; }
.crop input[type=range] { flex: 1; accent-color: #fff; height: 32px; }
.crop .chip { flex: 1; background: transparent; color: #fff; border-color: #475569; }
.crop .chip.on { background: #fff; color: var(--ink); border-color: #fff; }
.crop-foot { padding: 16px; display: flex; gap: 10px; }
.crop-foot .ghost { background: transparent; color: #fff; border-color: #475569; }
.btn2 { min-height: 84px; border: 1.5px solid #CBD5E1; border-radius: 14px; background: #fff; color: var(--ink); font-weight: 700; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center; cursor: pointer; }
.icb { width: 48px; height: 48px; border-radius: 24px; border: 0; background: transparent; color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; flex: none; position: relative; }
.icb.outline { background: #fff; border: 1px solid var(--line); }
.chip { min-height: 48px; padding: 0 10px; border: 1.5px solid #CBD5E1; border-radius: 12px; background: #fff; font-weight: 600; color: var(--ink2); display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-align: center; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip.col { flex-direction: column; gap: 2px; min-height: 64px; font-size: 15px; }
.chip.left { justify-content: flex-start; padding: 0 14px; min-height: 58px; }
.chip.small { min-height: 40px; font-size: 14px; }
.chip.on-out { background: var(--out); border-color: var(--out); color: #fff; }
.chip.on-in { background: var(--in); border-color: var(--in); color: #fff; }
.chip.on-sav { background: var(--sav); border-color: var(--sav); color: #fff; }
.quick { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 600; min-height: 84px; justify-content: center; background: none; border: 0; cursor: pointer; }
.quick .ms { width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; }

/* ===== ฟอร์ม ===== */
.fld { display: flex; flex-direction: column; gap: 6px; position: relative; }
.lbl { font-size: 15px; font-weight: 600; color: var(--ink2); }
.input, select.input, textarea.input { height: 52px; width: 100%; border: 1.5px solid #CBD5E1; border-radius: 12px; padding: 0 14px; font-weight: 500; font-size: 17px; background: #fff; }
textarea.input { height: 96px; padding: 12px 14px; resize: vertical; }
.input:focus, .chip:focus-visible, .btn:focus-visible, .row:focus-visible, .icb:focus-visible { outline: 3px solid #93C5FD; outline-offset: 1px; }
.input.err { border-color: var(--out); }
.err-text { color: var(--out); font-size: 14px; font-weight: 600; }
.amount-input { display: block; width: 100%; border: 0; background: transparent; text-align: center; font-weight: 700; font-size: 42px; padding: 0; }
.datebox { position: relative; height: 52px; border: 1.5px solid #CBD5E1; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; font-weight: 500; font-size: 17px; }
.datebox > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.datebox input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; border: 0; cursor: pointer; }
.check { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; cursor: pointer; min-height: 44px; }
.check input { width: 24px; height: 24px; accent-color: var(--ink); flex: none; }
.suggest { position: absolute; left: 0; right: 0; top: 84px; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(15, 23, 42, .14); overflow: hidden; }
.suggest button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line2); background: #fff; font-weight: 600; text-align: left; cursor: pointer; min-height: 48px; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 16px; }
.line > span:first-child { color: var(--muted); }
.line > span:last-child { font-weight: 700; }

/* ===== แถบ/กราฟ ===== */
.bar { height: 10px; border-radius: 5px; background: var(--line2); position: relative; overflow: visible; }
.bar > div { height: 10px; border-radius: 5px; }
.bar .mark { position: absolute; top: -3px; width: 2px; height: 16px; background: #64748B; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, .25); }
.hero { background: var(--ink); border-radius: 22px; padding: 20px 18px; color: #fff; display: flex; flex-direction: column; gap: 14px; }
.tile { border-radius: 16px; padding: 14px 12px; color: #fff; display: flex; flex-direction: column; gap: 4px; }
.tile .v { font-size: 19px; font-weight: 700; }

/* ===== หัวหน้า / แถบเดือน ===== */
.topbar { display: flex; align-items: center; gap: 6px; margin: -12px -16px 0; padding: 8px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.topbar h1 { flex: 1; font-size: 20px; }
.monthbar { display: flex; align-items: center; justify-content: space-between; }
.avatar { border-radius: 50%; background: var(--line); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); display: flex; align-items: center; justify-content: center; color: var(--muted); overflow: hidden; flex: none; text-decoration: none; padding: 0; cursor: pointer; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--warn); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

/* ===== ปุ่มบันทึกล่างจอ ===== */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
.savebar > div { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* ===== เมนูล่าง ===== */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(76px + env(safe-area-inset-bottom)); padding: 0 4px env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; max-width: 560px; margin: 0 auto; }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; font-size: 13px; color: #64748B; text-decoration: none; }
.nav a.on { color: var(--ink); font-weight: 700; }
.nav a.fab span { width: 56px; height: 56px; border-radius: 28px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; margin-top: -26px; font-size: 30px; }
.nav[hidden] { display: none; }

/* ===== Sheet / Toast / Loading ===== */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.sheet .grip { width: 48px; height: 5px; border-radius: 3px; background: #CBD5E1; margin: 0 auto 4px; }
#toasts { position: fixed; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; max-width: 520px; width: 100%; display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; box-shadow: 0 8px 24px rgba(15, 23, 42, .25); animation: tin .2s ease-out; }
.toast.ok { background: var(--in); } .toast.err { background: var(--out); } .toast.warn { background: var(--warn); }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
#loading { position: fixed; inset: 0; z-index: 80; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; }
#loading[hidden] { display: none; }
.loading-box { background: #fff; border-radius: 16px; padding: 18px 22px; display: flex; gap: 12px; align-items: center; font-weight: 600; max-width: 80vw; }
.spinner { width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
.btn .spinner { border-color: rgba(255, 255, 255, .35); border-top-color: #fff; width: 20px; height: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { height: 80px; border-radius: var(--r); background: linear-gradient(90deg, #EEF2F6 25%, #F8FAFC 50%, #EEF2F6 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* ===== ล็อก ===== */
.lock { min-height: 100vh; padding: 48px 28px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.dots { display: flex; gap: 14px; }
.dots span { width: 16px; height: 16px; border-radius: 8px; border: 2px solid #94A3B8; }
.dots span.f { background: var(--ink); border-color: var(--ink); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 340px; }
.keypad button { height: 72px; border-radius: 36px; border: 1px solid var(--line); background: #fff; font-size: 28px; font-weight: 600; cursor: pointer; }
.keypad button.k-bio { background: var(--ink); color: #fff; border: 0; }
.keypad button.k-del { background: transparent; border: 0; }

/* ===== เอกสาร ===== */
.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px 16px 14px; }
.doc { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-height: 120px; cursor: pointer; }
.doc .thumb { width: 100%; height: 64px; border-radius: 10px; background: var(--line2); color: var(--muted); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.doc .thumb img { width: 100%; height: 100%; object-fit: cover; }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.photos > * { aspect-ratio: 1; border-radius: 12px; background: var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
.photos img { width: 100%; height: 100%; object-fit: cover; }
.photos button.add { border: 1.5px dashed #94A3B8; background: #fff; color: var(--ink2); cursor: pointer; }
.slip { padding: 12px; display: flex; gap: 12px; align-items: center; border: 1.5px solid var(--ink); }
.slip .thumb { width: 60px; height: 76px; border-radius: 10px; background: var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }
.slip .thumb img { width: 100%; height: 100%; object-fit: cover; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 700px) { body { background: #EEF2F6; } #app { background: var(--bg); box-shadow: 0 0 0 1px var(--line); } }
/* กันชื่อไอคอนล้นปุ่ม ระหว่างที่ฟอนต์ไอคอนยังโหลดไม่เสร็จ */
.icb > .ms, .chip > .ms, .ic > .ms, .row > .ms, .btn > .ms { max-width: 1em; overflow: hidden; }

<script>
/* ============================================================
 * core.js — แกนกลางของแอป: เรียก API, cache, router, ตัวช่วย UI
 * ============================================================ */
// เลขเวอร์ชันระบบ — หน้าเว็บและหลังบ้าน (Code.gs) ใช้เลขเดียวกัน ถ้าไม่ตรงแอปจะเตือน
const APP_VERSION = '1.7.0';
// ประวัติเวอร์ชัน (ล่าสุดอยู่บน) แสดงในหน้า ตั้งค่า
const CHANGELOG = [
  ['1.7.0', '24 พ.ย. 69', 'แสดงเลขเวอร์ชัน · เตือนเมื่อหน้าเว็บกับหลังบ้านเป็นคนละเวอร์ชัน · ประวัติเวอร์ชัน'],
  ['1.6.0', '23 พ.ย. 69', 'รายการประจำ (แก้ ปรับยอด ตัด ยกเลิกยืนยัน) · บัญชีผ่อน & สะสม · แผนออม/โป๊ะหนี้ · ยอดยกมา · ประวัติรับราชการ · ล้างข้อมูล'],
  ['1.5.0', '22 พ.ย. 69', 'PIN 4 หลัก'],
  ['1.4.0', '22 พ.ย. 69', 'เข้าแอปด้วย PIN อย่างเดียว (ไม่ต้องกรอก URL/รหัส) · ตั้งเวลาล็อกอัตโนมัติ'],
  ['1.3.0', '22 พ.ย. 69', 'เปลี่ยนโลโก้แอป + ดาวน์โหลดชุดไอคอน'],
  ['1.2.0', '22 พ.ย. 69', 'ติดตั้งเป็นแอปบนมือถือได้ (PWA)'],
  ['1.1.0', '21 พ.ย. 69', 'เวอร์ชันแรกที่ใช้งานจริง']
];
// หน้าเว็บกับหลังบ้านเวอร์ชันไม่ตรงกัน (เช่น ลืม Deploy Code.gs ใหม่)
function versionMismatch() { return App.data && App.data.version && App.data.version !== APP_VERSION; }
function versionWarnHtml() {
  if (!versionMismatch()) return '';
  return '<div class="box warnbox row-flex" style="padding:12px 14px;gap:10px;align-items:flex-start"><span class="ms warn" aria-hidden="true">sync_problem</span><div><div class="t">เวอร์ชันไม่ตรงกัน</div>' +
    '<div class="s">หน้าเว็บ ' + APP_VERSION + ' · หลังบ้าน ' + esc(App.data.version) + ' — ' + (App.data.version < APP_VERSION ? 'ให้วาง Code.gs เวอร์ชัน ' + APP_VERSION + ' แล้ว Deploy เป็น New version' : 'ให้อัปโหลด index.html เวอร์ชัน ' + esc(App.data.version) + ' ขึ้น GitHub') + '</div></div></div>';
}
const NEW_PIN_LENGTH = 4; // PIN ที่ตั้งใหม่ใช้ 4 หลัก
const pinLen = () => Number(Store.get('pinLen', 6)); // ความยาว PIN ปัจจุบัน (PIN เก่า 6 หลัก)
// ที่อยู่หลังบ้าน (Apps Script /exec) — เปิดเผยได้ เพราะต้องใส่ PIN ถูกก่อนจึงจะดึงข้อมูลได้
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzDCfQR0ZfnphyL5pQ02dJVp3OHln4YmU8t4hUoW93h5COgSsbS1rrktuXX6ThPD2AK/exec';
const TH_MONTH_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_MONTH_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

/* ===== ตัวช่วยทั่วไป ===== */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { if (v === '' || v === null || v === undefined) return 0; const n = Number(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function isOn(v) { return v === true || String(v).toUpperCase() === 'TRUE' || v === 1 || v === '1'; }
function isActive(v) { return v === '' || v === undefined || isOn(v); }
function fmt(n, digits = 2) { return (Number(n) || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: digits }); }
function fmt2(n) { return (Number(n) || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
// แสดงเงินตามความหมาย: in = +, out = −, อื่นๆ ไม่มีเครื่องหมาย
function money(n, kind, digits) { const v = fmt(Math.abs(n), digits); return kind === 'in' ? '+' + v : kind === 'out' ? '−' + v : fmt(n, digits); }
function typeKind(type) { return { 'รายรับ': 'in', 'รายจ่าย': 'out', 'ออม': 'sav' }[type] || 'ink'; }
function pad2(n) { return ('0' + n).slice(-2); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
// วันที่แบบไทยสั้น: 21 พ.ย.69
function thDate(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '-';
  return Number(m[3]) + ' ' + TH_MONTH_SHORT[Number(m[2]) - 1] + String(Number(m[1]) + 543).slice(-2);
}
function thMonth(ym, short) { const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)); return (short ? TH_MONTH_SHORT : TH_MONTH_FULL)[m - 1] + ' ' + (short ? String(y + 543).slice(-2) : (y + 543)); }
function addMonth(ym, d) { let y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) + d; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad2(m); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function uniq(arr) { return arr.filter((x, i) => x && arr.indexOf(x) === i); }

/* ===== เก็บค่าในเครื่อง (localStorage) ===== */
const Store = {
  get(k, d) { try { const v = localStorage.getItem('fa_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fa_' + k, JSON.stringify(v)); } catch (e) { /* เต็ม: ข้าม */ } },
  del(k) { try { localStorage.removeItem('fa_' + k); } catch (e) { /* ข้าม */ } }
};

/* ===== เรียกหลังบ้าน ===== */
async function api(action, payload = {}) {
  const url = Store.get('url', '') || BACKEND_URL;
  const key = Store.get('key', ''), token = Store.get('token', '');
  let res;
  try {
    // ส่งเป็น text/plain (ค่าเริ่มต้น) เพื่อไม่ให้ติด CORS preflight ของ Apps Script
    res = await fetch(url, { method: 'POST', body: JSON.stringify({ key, token, action, payload }) });
  } catch (e) {
    throw new Error('เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('หลังบ้านตอบกลับผิดรูปแบบ (ตรวจสอบ URL /exec)'); }
  if (!j.ok) {
    // บัตรผ่านหมดอายุ/ถูกยกเลิก (เช่น เปลี่ยน PIN จากเครื่องอื่น) → กลับไปหน้าใส่ PIN
    if (j.needLogin) { Store.del('token'); Store.del('key'); Store.del('hasPin'); setTimeout(() => Lock.close(), 0); }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j.data;
}

/* ===== ข้อมูลแอป + cache ===== */
const App = { data: null, month: todayStr().slice(0, 7), loading: null };

async function loadData(force) {
  const cacheKey = 'boot_' + App.month;
  if (!force && !App.data) {
    const c = Store.get(cacheKey, null);
    if (c) { App.data = c; refreshInBackground(); return c; }
  }
  if (App.loading) return App.loading;
  App.loading = api('bootstrap', { month: App.month }).then(d => {
    App.data = d;
    // เก็บเฉพาะเดือนปัจจุบัน ไม่ให้ localStorage เต็ม
    Object.keys(localStorage).filter(k => k.indexOf('fa_boot_') === 0 && k !== 'fa_' + cacheKey).forEach(k => localStorage.removeItem(k));
    Store.set(cacheKey, d);
    Store.set('hasPin', !!d.settings.hasPin);
    if (d.settings.pinLength) Store.set('pinLen', Number(d.settings.pinLength));
    Store.set('me', { nickname: d.settings.nickname || '', photoUrl: d.settings.photoUrl || '' });
    Logo.sync(d.settings.logoVer || '');
    if (d.settings.lockMinutes !== undefined && d.settings.lockMinutes !== '') Store.set('lockMin', Number(d.settings.lockMinutes));
    return d;
  }).finally(() => { App.loading = null; });
  return App.loading;
}

// แสดงข้อมูลในเครื่องก่อน แล้วโหลดของใหม่เงียบๆ
function refreshInBackground() {
  setTimeout(() => {
    loadData(true).then(() => { if (!document.querySelector('.sheet-bg') && !isFormPage()) render(true); }).catch(() => { /* ใช้ของในเครื่องต่อ */ });
  }, 50);
}

// หลังบันทึก: โหลดใหม่ทั้งหมด
async function refresh() { await loadData(true); }

function setMonth(ym) {
  App.month = ym;
  App.data = Store.get('boot_' + ym, null);
  if (App.data) refreshInBackground();
  render();
}

/* ===== Router ===== */
const Routes = {};
function route(name, def) { Routes[name] = def; }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const [name, q] = h.split('?');
  return { name, params: Object.fromEntries(new URLSearchParams(q || '')) };
}
function isFormPage() { const r = Routes[parseHash().name]; return r && r.form; }

async function render(silent) {
  const main = $('#main'), nav = $('#nav');
  if (!Lock.isOpen()) { nav.hidden = true; return Lock.show(main); }
  const { name, params } = parseHash();
  const r = Routes[name] || Routes.home;
  nav.hidden = !r.nav;
  $$('#nav a[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === r.nav));
  main.className = r.form ? 'form' : '';
  if (r.needData !== false && !App.data) {
    main.innerHTML = '<div class="skel"></div><div class="skel" style="height:160px"></div><div class="skel"></div>';
    try { await loadData(); } catch (e) {
      main.innerHTML = '<div class="box pad" style="text-align:center;display:flex;flex-direction:column;gap:12px"><span class="ms out" style="font-size:40px" aria-hidden="true">cloud_off</span><div class="t">' + esc(e.message) + '</div><button class="btn" onclick="render()">ลองใหม่</button><a class="btn ghost" href="#/settings">ตั้งค่าการเชื่อมต่อ</a></div>';
      return;
    }
  }
  try {
    main.innerHTML = r.html(params);
    if (r.mount) r.mount(params, main);
  } catch (e) {
    console.error(e);
    main.innerHTML = '<div class="box pad"><div class="t out">แสดงหน้านี้ไม่ได้</div><div class="s">' + esc(e.message) + '</div></div>';
  }
  if (!silent) { window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', () => render());

/* ===== UI ===== */
function toast(msg, type = 'ok', ms = 3000) {
  const icon = { ok: 'check_circle', err: 'error', warn: 'warning', info: 'info' }[type] || 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', type === 'err' ? 'alert' : 'status');
  el.innerHTML = '<span class="ms" aria-hidden="true">' + icon + '</span><span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? Math.max(ms, 5000) : ms);
}
function showLoading(text) { $('#loadingText').textContent = text || 'กำลังโหลด…'; $('#loading').hidden = false; }
function hideLoading() { $('#loading').hidden = true; }

// ทำงานพร้อมสถานะกำลังโหลดบนปุ่ม + แจ้งผล
async function busy(btn, fn, okMsg) {
  if (btn && btn.disabled) return;
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>กำลังบันทึก…'; }
  try {
    const r = await fn();
    if (okMsg) toast(okMsg, 'ok');
    return r;
  } catch (e) {
    toast(e.message || String(e), 'err');
    throw e;
  } finally {
    if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; }
  }
}

// หน้าต่างเลื่อนขึ้นจากล่าง
function sheet(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="grip" aria-hidden="true"></div>' + html + '</div>';
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  const el = $('.sheet', bg);
  $$('[data-close]', el).forEach(b => b.addEventListener('click', close));
  if (onMount) onMount(el, close);
  const first = el.querySelector('input,select,textarea,button:not([data-close])');
  if (first && first.tagName !== 'BUTTON') setTimeout(() => first.focus(), 50);
  return { el, close };
}

function confirmBox(msg, okText = 'ยืนยัน', danger = false) {
  return new Promise(resolve => {
    sheet('<h2>' + esc(msg) + '</h2><button class="btn" data-ok style="' + (danger ? 'background:#B91C1C' : '') + '">' + esc(okText) + '</button><button class="btn ghost" data-close>ยกเลิก</button>', (el, close) => {
      $('[data-ok]', el).onclick = () => { close(); resolve(true); };
      $$('[data-close]', el).forEach(b => b.addEventListener('click', () => resolve(false)));
    });
  });
}

/* ===== ส่วนประกอบที่ใช้ซ้ำ ===== */
function topbar(title, back, right = '') {
  return '<div class="topbar"><a href="' + back + '" class="icb" aria-label="ย้อนกลับ"><span class="ms" aria-hidden="true">arrow_back</span></a><h1>' + esc(title) + '</h1>' + right + '</div>';
}
function monthbar(label) {
  return '<div class="monthbar"><button class="icb" aria-label="เดือนก่อน" onclick="setMonth(addMonth(App.month,-1))"><span class="ms" aria-hidden="true">chevron_left</span></button>' +
    '<h1>' + esc(label) + '</h1><button class="icb" aria-label="เดือนถัดไป" onclick="setMonth(addMonth(App.month,1))"><span class="ms" aria-hidden="true">chevron_right</span></button></div>';
}
function row({ icon, title, sub, amount, kind = 'ink', href, attrs = '', right = '' }) {
  const tag = href ? 'a href="' + href + '"' : (attrs ? 'button type="button"' : 'div');
  const end = href ? 'a' : (attrs ? 'button' : 'div');
  return '<' + tag + ' class="row" ' + attrs + '><div class="ic"><span class="ms" aria-hidden="true">' + (icon || 'circle') + '</span></div>' +
    '<div class="grow"><div class="t">' + esc(title) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>' +
    (amount !== undefined && amount !== '' ? '<div class="amt ' + kind + '">' + esc(amount) + '</div>' : '') + right +
    ((href || attrs) ? '<span class="ms chev" aria-hidden="true">chevron_right</span>' : '') + '</' + end + '>';
}
function chips(name, options, value, cls = '') {
  return options.map(o => {
    const v = typeof o === 'object' ? o.value : o, l = typeof o === 'object' ? o.label : o;
    return '<button type="button" class="chip ' + cls + (String(v) === String(value) ? ' on' : '') + '" data-chip="' + name + '" data-value="' + esc(v) + '" aria-pressed="' + (String(v) === String(value)) + '">' + l + '</button>';
  }).join('');
}
// ผูกปุ่มตัวเลือก: คลิกแล้วเปลี่ยน state
function bindChips(el, name, onPick) {
  $$('[data-chip="' + name + '"]', el).forEach(b => b.addEventListener('click', () => {
    $$('[data-chip="' + name + '"]', el).forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
    b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
    onPick(b.dataset.value, b);
  }));
}
// ช่องวันที่ แสดงแบบ 21 พ.ย.69 แต่ใช้ปฏิทินของมือถือ
function dateField(id, label, value) {
  return '<div class="fld"><label class="lbl" for="' + id + '">' + esc(label) + '</label><div class="datebox"><span id="' + id + '_t">' + thDate(value) + '</span>' +
    '<span class="ms" aria-hidden="true" style="color:#475569">calendar_month</span><input type="date" id="' + id + '" value="' + esc(value) + '"></div></div>';
}
document.addEventListener('change', e => {
  if (e.target.matches('.datebox input')) { const t = document.getElementById(e.target.id + '_t'); if (t) t.textContent = thDate(e.target.value); }
});
function field(id, label, value, attrs = '') {
  return '<div class="fld"><label class="lbl" for="' + id + '">' + label + '</label><input class="input" id="' + id + '" value="' + esc(value === undefined ? '' : value) + '" ' + attrs + '></div>';
}
function avatarHtml(size, photoUrl, attrs = '') {
  const inner = photoUrl ? '<img src="' + esc(photoUrl) + '" alt="">' : '<span class="ms" aria-hidden="true" style="font-size:' + Math.round(size * 0.58) + 'px">person</span>';
  return '<a class="avatar" style="width:' + size + 'px;height:' + size + 'px" ' + attrs + '>' + inner + '</a>';
}
function aiTag() { return '<span class="ai-tag"><span class="ms" aria-hidden="true">auto_awesome</span>จากสลิป</span>'; }

/* ===== โลโก้แอป ===== */
// เก็บรูปโลโก้ไว้ในเครื่อง (localStorage) ใช้ที่หน้าล็อก ไอคอนแท็บ และไอคอน iPhone
// ถ้าเปลี่ยนจากเครื่องอื่น ระบบจะเห็นเลข logoVer ไม่ตรง แล้วดึงรูปใหม่มาเอง
const Logo = {
  DEFAULT: 'icon-512.png',
  src() { return Store.get('logo', '') || Logo.DEFAULT; },
  isCustom() { return !!Store.get('logo', ''); },
  html(size, attrs = '') { return '<img class="applogo" src="' + esc(Logo.src()) + '" alt="" width="' + size + '" height="' + size + '" style="width:' + size + 'px;height:' + size + 'px" ' + attrs + '>'; },
  // ตั้งไอคอนแท็บ + ไอคอน iPhone ให้ตรงกับโลโก้ปัจจุบัน
  apply() {
    const src = Logo.src();
    [['icon', src], ['apple-touch-icon', Logo.isCustom() ? src : 'apple-touch-icon.png']].forEach(([rel, href]) => {
      let l = document.querySelector('link[rel="' + rel + '"]');
      if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
      l.href = href;
    });
  },
  set(dataUrl, ver) {
    if (dataUrl) Store.set('logo', dataUrl); else Store.del('logo');
    Store.set('logoVer', ver || '');
    Logo.apply();
  },
  async sync(ver) {
    if (ver === Store.get('logoVer', '')) return;
    if (!ver) { Logo.set('', ''); return; }

// วาดรูปลงกรอบสี่เหลี่ยมจัตุรัสตามค่าที่ผู้ใช้ปรับ (ใช้ทั้งตอนแสดงตัวอย่างและตอนสร้างไฟล์จริง)
function drawLogo(ctx, size, img, st) {
  const k = size / st.frame;
  ctx.save();
  ctx.fillStyle = st.bg; ctx.fillRect(0, 0, size, size);
  ctx.translate(size / 2 + st.x * k, size / 2 + st.y * k);
  ctx.rotate(st.rot * Math.PI / 2);
  const sc = st.base * st.zoom * k;
  ctx.drawImage(img, -img.naturalWidth * sc / 2, -img.naturalHeight * sc / 2, img.naturalWidth * sc, img.naturalHeight * sc);
  ctx.restore();
}

// เปิดหน้าปรับโลโก้ (ลาก/ซูม/หมุน/เลือกพื้นหลัง) คืนค่า dataUrl ขนาด 512px หรือ null ถ้ายกเลิก
function cropLogo(file) {
  return new Promise(async (resolve) => {
    let img;
    try {
      const src = await readAsDataUrl(file);
      img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('เปิดรูปไม่ได้')); i.src = src; });
    } catch (e) { toast(e.message, 'err'); return resolve(null); }

    const frame = Math.min(300, window.innerWidth - 48);
    // สีพื้นหลังแบบ "เดิม" = สีมุมซ้ายบนของรูป
    const probe = document.createElement('canvas'); probe.width = probe.height = 1;
    probe.getContext('2d').drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
    const px = probe.getContext('2d').getImageData(0, 0, 1, 1).data;
    const bgs = { orig: 'rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')', white: '#FFFFFF', navy: '#0F172A' };
    const st = { frame, x: 0, y: 0, zoom: 1, rot: 0, bg: bgs.orig, base: 1 };
    const fitBase = () => { const w = st.rot % 2 ? img.naturalHeight : img.naturalWidth, h = st.rot % 2 ? img.naturalWidth : img.naturalHeight; st.base = Math.max(frame / w, frame / h); };
    fitBase();

    const ov = document.createElement('div');
    ov.className = 'crop'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = '<div class="crop-top"><button type="button" class="icb" style="color:#fff" id="cr_x" aria-label="ยกเลิก"><span class="ms" aria-hidden="true">close</span></button><h2>ปรับโลโก้</h2><span style="width:48px"></span></div>' +
      '<div class="crop-body"><div class="crop-frame" id="cr_f"><canvas id="cr_c" width="' + frame * 2 + '" height="' + frame * 2 + '" style="width:' + frame + 'px;height:' + frame + 'px"></canvas></div>' +
      '<div class="s" style="color:#CBD5E1;text-align:center">ลากรูปเพื่อเลื่อน · ถ่างนิ้วเพื่อซูม<br>กรอบขาว = ส่วนที่จะเป็นไอคอน</div>' +
      '<div class="row-flex" style="width:100%;max-width:340px"><span class="ms" aria-hidden="true">zoom_out</span><input type="range" id="cr_z" min="0.5" max="4" step="0.01" value="1" aria-label="ซูม"><span class="ms" aria-hidden="true">zoom_in</span></div>' +
      '<div class="row-flex" style="width:100%;max-width:340px" role="group" aria-label="สีพื้นหลัง"><button type="button" class="chip on" data-bg="orig">พื้นหลังเดิม</button><button type="button" class="chip" data-bg="white">ขาว</button><button type="button" class="chip" data-bg="navy">น้ำเงินเข้ม</button></div></div>' +
      '<div class="crop-foot"><button type="button" class="btn ghost" style="flex:1" id="cr_r"><span class="ms" aria-hidden="true">rotate_right</span>หมุน</button><button type="button" class="btn" style="flex:2;background:var(--in)" id="cr_ok"><span class="ms" aria-hidden="true">check</span>ใช้รูปนี้</button></div>';
    document.body.appendChild(ov);

    const cv = $('#cr_c', ov), ctx = cv.getContext('2d'), zr = $('#cr_z', ov);
    const paint = () => drawLogo(ctx, frame * 2, img, st);
    paint();
    const close = (val) => { ov.remove(); resolve(val); };

    // ลากด้วยนิ้วเดียว / ถ่างสองนิ้วเพื่อซูม
    const pts = new Map(); let pinch = null;
    const f = $('#cr_f', ov);
    f.addEventListener('pointerdown', e => { f.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: st.zoom }; } });
    f.addEventListener('pointermove', e => {
      const prev = pts.get(e.pointerId); if (!prev) return;
      const cur = { x: e.clientX, y: e.clientY };
      pts.set(e.pointerId, cur);
      if (pts.size === 2 && pinch) {
        const [a, b] = [...pts.values()];
        st.zoom = Math.min(4, Math.max(0.5, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)); zr.value = st.zoom;
      } else if (pts.size === 1) { st.x += cur.x - prev.x; st.y += cur.y - prev.y; }
      paint();
    });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
    f.addEventListener('pointerup', up); f.addEventListener('pointercancel', up);
    f.addEventListener('wheel', e => { e.preventDefault(); st.zoom = Math.min(4, Math.max(0.5, st.zoom * (e.deltaY < 0 ? 1.08 : 0.92))); zr.value = st.zoom; paint(); }, { passive: false });

    zr.oninput = () => { st.zoom = +zr.value; paint(); };
    $$('[data-bg]', ov).forEach(b => b.onclick = () => { $$('[data-bg]', ov).forEach(x => x.classList.toggle('on', x === b)); st.bg = bgs[b.dataset.bg]; paint(); });
    $('#cr_r', ov).onclick = () => { st.rot = (st.rot + 1) % 4; const t = st.x; st.x = -st.y; st.y = t; fitBase(); paint(); };
    $('#cr_x', ov).onclick = () => close(null);
    $('#cr_ok', ov).onclick = () => {
      const out = document.createElement('canvas'); out.width = out.height = 512;
      drawLogo(out.getContext('2d'), 512, img, st);
      close(out.toDataURL('image/jpeg', 0.9));
    };
  });
}

// สร้างไฟล์ไอคอน 3 ขนาดจากโลโก้ปัจจุบัน แล้วดาวน์โหลดทีละไฟล์
async function downloadIconSet() {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('เปิดโลโก้ไม่ได้')); i.src = Logo.src(); });
  const files = [['icon-512.png', 512], ['icon-192.png', 192], ['apple-touch-icon.png', 180]];
  for (const [name, size] of files) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(img, 0, 0, size, size);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();

  }
}

function githubUploadUrl() {

function readAsDataUrl(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
// ย่อรูปก่อนอัปโหลด (กว้าง/สูงไม่เกิน max px, คุณภาพ q) — PDF ส่งตามเดิม
async function compressImage(file, max = 800, q = 0.7, square = false) {
  if (!file) return null;
  if (file.type === 'application/pdf') return readAsDataUrl(file);
  const src = await readAsDataUrl(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('เปิดรูปไม่ได้')); i.src = src; });
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (square) { const s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
  const scale = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

// คำนวณส่วนลด/แต้มฝั่งหน้าเว็บ (ตรงกับหลังบ้าน) เพื่อแสดงผลทันที
function calcFuel(f) {
  const liters = num(f.liters), price = num(f.price);
  const total = round2(liters * price);
  const pc = D.card(f.pointCardId), pay = D.card(f.payCardId);
  let dl = 0, disc = 0;
  if (pc && num(pc.discountPerLiter) > 0 && num(pc.quotaLiters) > 0) {
    const st = D.cardStatus(pc.id);
    let left = st ? st.quotaLeft : num(pc.quotaLiters);
    if (f.editingLiters && f.editingCardId === pc.id) left += f.editingLiters; // แก้ไขรายการเดิม คืนโควตาเดิมก่อน
    dl = round2(Math.min(liters, left));
    disc += dl * num(pc.discountPerLiter);
  }
  [pc, pay].filter((c, i, a) => c && a.indexOf(c) === i).forEach(c => {
    if (num(c.discountPercent) > 0 && (!c.discountStation || c.discountStation === f.station)) disc += total * num(c.discountPercent) / 100;
  });
  disc = round2(disc);
  const net = round2(total - disc);
  const earn = (c) => (c && num(c.earnBaht) > 0) ? Math.floor(net / num(c.earnBaht)) * (num(c.earnPoints) || 1) : 0;
  return { total, discountLiters: dl, discount: disc, netPaid: net, points: earn(pc), payPoints: pay && (!pc || pay.id !== pc.id) ? earn(pay) : 0 };
}

      row({ icon: 'account_balance', title: 'คงเหลือสุทธิ', amount: fmt(assets - debts, 0), kind: 'ink', href: '#/assets' }) + '</div>' +
      '<div class="box"><div class="hd"><h2>ตู้น้ำมัน</h2></div>' +
      row({ icon: 'local_gas_station', title: 'กำไรเดือนนี้', sub: low.length ? low.join(', ') + ' ใกล้หมด' : D.activePumps().length + ' ตู้', amount: money(fuelNet, fuelNet >= 0 ? 'in' : 'out', 0), kind: fuelNet >= 0 ? 'in' : 'out', href: '#/fuel' }) + '</div>' +
      '<div class="box"><div class="hd"><h2>ล่าสุด</h2><a href="#/list" class="s" style="font-weight:600;color:#334155">ดูทั้งหมด</a></div>' +
      (recent.length ? recent.map(t => row({ icon: catIcon(t.type, t.category), title: t.title, sub: thDate(t.date) + ' · ' + (t.category || t.type), amount: money(num(t.amount), typeKind(t.type)), kind: typeKind(t.type), href: '#/record?id=' + encodeURIComponent(t.id) })).join('')
        : '<div class="empty">ยังไม่มีรายการเดือนนี้ · กดปุ่ม + เพื่อเริ่มบันทึก</div>') + '</div>' +
      '<a href="#/settings" class="s" style="text-align:center;text-decoration:none">เวอร์ชัน ' + APP_VERSION + (versionMismatch() ? ' · หลังบ้าน ' + esc(d.version) + ' ⚠' : '') + '</a>';
  }
});

/* ---------- รายการเดือนนี้ ---------- */
route('list', {
  nav: 'list',
  html(p) {
    const f = p.f || 'ทั้งหมด';
    const pend = App.data.pendingRecurring || [];
    return monthbar('รายการ · ' + thMonth(App.month, true)) +
      '<div class="fld"><span class="ms" aria-hidden="true" style="position:absolute;left:14px;top:14px;color:#64748B">search</span><input id="q" class="input" placeholder="ค้นหารายการ…" aria-label="ค้นหารายการ" style="padding-left:46px"></div>' +
      '<div class="grid4">' + chips('f', [{ value: 'ทั้งหมด', label: 'ทั้งหมด' }, { value: 'รายรับ', label: 'รับ' }, { value: 'รายจ่าย', label: 'จ่าย' }, { value: 'ออม', label: 'ออม' }], f) + '</div>' +
      pendingHtml() +
      '<div id="txlist"></div>';
  },
  mount(p, el) {
    let filter = p.f || 'ทั้งหมด', q = '';
    const draw = () => {
      const list = txSorted(App.data.transactions || []).filter(t => (filter === 'ทั้งหมด' || t.type === filter) && (!q || (String(t.title) + ' ' + t.category + ' ' + t.note).toLowerCase().indexOf(q) >= 0));
      if (!list.length) { $('#txlist', el).innerHTML = '<div class="box empty">ไม่พบรายการ</div>'; return; }
      const groups = {};
      list.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
      $('#txlist', el).innerHTML = '<div class="box">' + Object.keys(groups).map((d, i) => '<div class="hd" ' + (i ? 'style="border-top:1px solid #F1F5F9"' : '') + '><h2>' + thDate(d) + '</h2></div>' +
        groups[d].map(t => row({ icon: catIcon(t.type, t.category), title: t.title, sub: (t.category || t.type) + (t.slipUrl ? ' · มีสลิป' : ''), amount: money(num(t.amount), typeKind(t.type)), kind: typeKind(t.type), href: '#/record?id=' + encodeURIComponent(t.id) })).join('')).join('') + '</div>';
    };
    draw();
    bindChips(el, 'f', v => { filter = v; draw(); });
    $('#q', el).addEventListener('input', debounce(e => { q = e.target.value.trim().toLowerCase(); draw(); }, 250));
    mountPending(el);
  }
});

/* ---------- บันทึกรายการ (เพิ่ม/แก้ไข) ---------- */
route('record', {
  form: true,
  html(p) {
    const old = p.id ? (App.data.transactions || []).find(t => t.id === p.id) : null;
    if (p.id && !old) return topbar('บันทึกรายการ', '#/list') + '<div class="box empty">ไม่พบรายการนี้ (อาจอยู่เดือนอื่น)</div>';
    if (old && old.refTable === 'FuelPurchases') {
      return topbar('รายการเติมน้ำมัน', '#/list') + '<div class="box pad" style="display:flex;flex-direction:column;gap:8px"><div class="t">' + esc(old.title) + '</div>' +
        '<div class="line"><span>วันที่</span><span>' + thDate(old.date) + '</span></div><div class="line"><span>จ่ายจริง</span><span class="out">−' + fmt2(old.amount) + '</span></div>' +
        '<div class="s">รายการนี้สร้างจากการเติมน้ำมัน (มีโควตา/แต้มผูกอยู่) ถ้าบันทึกผิดให้ลบแล้วบันทึกใหม่</div></div>' +
        '<button class="btn danger" id="delFuel"><span class="ms" aria-hidden="true">delete</span>ลบรายการนี้</button>';
    }
    const type = old ? old.type : (p.type || 'รายจ่าย');
    return topbar(old ? 'แก้ไขรายการ' : 'บันทึกรายการ', old ? '#/list' : '#/home') +
      '<div id="slipBox"></div>' +
      '<div class="grid3">' + ['รายรับ', 'รายจ่าย', 'ออม'].map(t => '<button type="button" class="chip' + (t === type ? ' on on-' + typeKind(t) : '') + '" data-type="' + t + '" aria-pressed="' + (t === type) + '">' + t + '</button>').join('') + '</div>' +
      '<div style="text-align:center"><label for="amt" class="s">จำนวนเงิน (บาท)<span id="amtTag"></span></label><input id="amt" class="amount-input ' + typeKind(type) + '" inputmode="decimal" placeholder="0" value="' + (old ? esc(old.amount) : '') + '"><div class="s" id="amtNote"></div></div>' +
      dateField('date', 'วันที่', old ? old.date : todayStr()) +
      '<div class="fld"><label class="lbl" for="title">ชื่อรายการ</label><input id="title" class="input" autocomplete="off" value="' + (old ? esc(old.title) : '') + '" placeholder="เช่น ค่าไฟบ้าน"><div id="sug"></div></div>' +
      '<div class="fld"><div class="lbl">หมวดหมู่</div><div class="grid3" id="cats"></div></div>' +
      '<div id="fuelBox"></div>' +
      '<div class="fld"><label class="lbl" for="note">หมายเหตุ</label><input id="note" class="input" value="' + (old ? esc(old.note) : '') + '" placeholder="ไม่บังคับ"></div>' +
      (old ? '' : '<label class="check"><input type="checkbox" id="rec">ทำซ้ำทุกเดือน (ขึ้นรอยืนยันทุกเดือน)</label>') +
      '<div class="savebar"><div><button class="btn" id="save">บันทึก</button>' + (old ? '<button class="btn danger" id="del"><span class="ms" aria-hidden="true">delete</span>ลบรายการนี้</button>' : '') + '</div></div>';
  },
  mount(p, el) {
    const old = p.id ? (App.data.transactions || []).find(t => t.id === p.id) : null;
    if (old && old.refTable === 'FuelPurchases') {
      $('#delFuel', el).onclick = async (e) => {
        if (!await confirmBox('ลบรายการเติมน้ำมันนี้? (แต้ม/โควตาจะคืนด้วย)', 'ลบ', true)) return;
        await busy(e.currentTarget, async () => { await api('deleteRecord', { table: 'FuelPurchases', id: old.refId }); await refresh(); go('#/list'); }, 'ลบแล้ว');
      };
      return;
    }
    if (!old && p.id) return;
    const S = {
      type: old ? old.type : (p.type || 'รายจ่าย'), category: old ? old.category : '', slipUrl: old ? old.slipUrl : '', slipThumb: old && old.slipUrl ? old.slipUrl : '',
      fuel: { station: 'PT', fuelType: '95', liters: '', price: (D.price('95') || {}).price || '', pointCardId: '', pay: 'cash' }, ai: {}
    };
    const isFuel = () => S.type === 'รายจ่าย' && S.category === 'น้ำมันรถ' && !old;

    // ----- สลิป -----
    const drawSlip = (state) => {
      const box = $('#slipBox', el);
      const has = !!S.slipThumb;
      box.innerHTML = (has ? '<div class="box slip"><div class="thumb"><img src="' + esc(S.slipThumb) + '" alt="รูปสลิป"></div><div class="grow"><div class="t row-flex" style="gap:6px">' +
        (state === 'read' ? '<span class="ms in" aria-hidden="true" style="font-size:20px">check_circle</span>Gemini อ่านสลิปแล้ว' : 'แนบสลิปแล้ว') + '</div><div class="s">' +
        (state === 'read' ? 'กรอกให้แล้ว · ตรวจสอบก่อนบันทึก' : 'แตะถ่ายใหม่เพื่อเปลี่ยน') + '</div></div><button class="icb" data-slip="camera" aria-label="ถ่ายสลิปใหม่"><span class="ms" aria-hidden="true">restart_alt</span></button></div>' : '') +
        '<div class="grid2" style="' + (has ? 'margin-top:8px' : '') + '"><button class="chip" data-slip="camera"><span class="ms" aria-hidden="true">photo_camera</span>ถ่ายรูปสลิป</button><button class="chip" data-slip="gallery"><span class="ms" aria-hidden="true">photo_library</span>เลือกจากคลัง</button></div>' +
        (has ? '' : '<div class="s" style="text-align:center;margin-top:6px">แนบสลิปแล้ว ' + (App.data.settings.hasGemini ? 'Gemini จะช่วยอ่านและกรอกให้' : 'ระบบจะเก็บรูปไว้ (ยังไม่ได้ตั้งค่า Gemini)') + '</div>');
      $$('[data-slip]', box).forEach(b => b.onclick = () => takeSlip(b.dataset.slip === 'camera'));
    };
    const takeSlip = async (camera) => {
      const file = await pickFile({ camera });
      if (!file) return;
      try {
        const dataUrl = await compressImage(file, 800, 0.7);
        S.slipThumb = dataUrl;
        if (App.data.settings.hasGemini) {
          showLoading('Gemini กำลังอ่านสลิป…');
          const r = await api('readSlip', { base64: dataUrl, kind: 'transaction' });
          S.slipUrl = r.image ? r.image.url : '';
          applySlip(r.fields || {});
          drawSlip('read');
          toast('อ่านสลิปแล้ว ตรวจสอบก่อนบันทึก', 'ok');
        } else {
          showLoading('กำลังอัปโหลดสลิป…');
          const r = await uploadDataUrl(dataUrl, 'slip_' + Date.now() + '.jpg');
          S.slipUrl = r.url;
          drawSlip('');
        }
      } catch (e) { toast(e.message, 'err'); drawSlip(''); } finally { hideLoading(); }
    };
    const applySlip = (f) => {
      if (f.type && ['รายรับ', 'รายจ่าย', 'ออม'].indexOf(f.type) >= 0) setType(f.type);
      if (f.date) { $('#date', el).value = f.date; $('#date_t', el).textContent = thDate(f.date); S.ai.date = 1; }
      if (f.title) { $('#title', el).value = f.title; S.ai.title = 1; }
      if (f.note) $('#note', el).value = f.note;
      if (f.isFuel && S.type === 'รายจ่าย') {
        S.category = 'น้ำมันรถ';
        if (f.station) S.fuel.station = f.station;
        if (f.fuelType) S.fuel.fuelType = String(f.fuelType);
        if (num(f.liters) > 0) S.fuel.liters = num(f.liters);
        if (num(f.pricePerLiter) > 0) S.fuel.price = num(f.pricePerLiter);
        drawCats(); drawFuel();
      } else if (num(f.amount) > 0) { $('#amt', el).value = num(f.amount); S.ai.amount = 1; }
      $('#amtTag', el).innerHTML = (S.ai.amount || f.isFuel) ? aiTag() : '';
      // เดาหมวดจากชื่อที่เคยบันทึก
      const sg = (App.data.titleSuggestions || []).find(s => s.type === S.type && s.title === $('#title', el).value);
      if (sg && !S.category) { S.category = sg.category; drawCats(); }
    };

    // ----- ประเภท / หมวด -----
    const setType = (t) => {
      S.type = t;
      $$('[data-type]', el).forEach(b => { const on = b.dataset.type === t; b.className = 'chip' + (on ? ' on on-' + typeKind(t) : ''); b.setAttribute('aria-pressed', on); });
      $('#amt', el).className = 'amount-input ' + typeKind(t);
      if (!(App.data.categories || []).some(c => c.type === t && c.name === S.category)) S.category = '';
      drawCats(); drawFuel();
    };
    const drawCats = () => {
      const cats = (App.data.categories || []).filter(c => c.type === S.type).sort((a, b) => num(a.sort) - num(b.sort));
      $('#cats', el).innerHTML = cats.map(c => '<button type="button" class="chip col' + (c.name === S.category ? ' on' : '') + '" data-cat="' + esc(c.name) + '" aria-pressed="' + (c.name === S.category) + '"><span class="ms" aria-hidden="true">' + esc(c.icon || 'circle') + '</span>' + esc(c.name) + '</button>').join('');
      $$('[data-cat]', el).forEach(b => b.onclick = () => { S.category = b.dataset.cat; drawCats(); drawFuel(); });
    };
    $$('[data-type]', el).forEach(b => b.onclick = () => setType(b.dataset.type));

    // ----- รายละเอียดเติมน้ำมัน (รถส่วนตัว) -----
    const drawFuel = () => {
      const box = $('#fuelBox', el);
      if (!isFuel()) { box.innerHTML = ''; $('#amt', el).readOnly = false; $('#amtNote', el).textContent = ''; return; }
      const f = S.fuel;
      box.innerHTML = '<div class="box pad" style="display:flex;flex-direction:column;gap:12px"><div class="lbl">เติมน้ำมัน</div>' +
        '<div class="grid4">' + chips('st', ['ปตท.', 'PT', 'บางจาก', 'อื่นๆ'], f.station) + '</div>' +
        '<div class="grid4">' + chips('ft', ['95', '91', 'E20', 'ดีเซล'], f.fuelType, 'small') + '</div>' +
        '<div class="grid2">' + field('fl', 'ลิตร', f.liters, 'inputmode="decimal"') + field('fp', 'ราคา/ลิตร', f.price, 'inputmode="decimal"') + '</div>' +
        '<div class="fld"><label class="lbl" for="fpc">บัตรสะสมแต้ม</label><select id="fpc" class="input">' + pointCardOptions(f.pointCardId) + '</select></div>' +
        '<div class="fld"><label class="lbl" for="fpay">ชำระด้วย</label><select id="fpay" class="input">' + payOptions(f.pay) + '</select></div>' +
        '<div id="fcalc" style="border-top:1px solid #F1F5F9;padding-top:8px"></div></div>';
      bindChips(box, 'st', v => { f.station = v; calc(); });
      bindChips(box, 'ft', v => { f.fuelType = v; const pr = D.price(v); if (pr && !num(f.price)) { f.price = pr.price; $('#fp', box).value = pr.price; } calc(); });
      $('#fl', box).oninput = e => { f.liters = e.target.value; calc(); };
      $('#fp', box).oninput = e => { f.price = e.target.value; calc(); };
      $('#fpc', box).onchange = e => { f.pointCardId = e.target.value; calc(); };
      $('#fpay', box).onchange = e => { f.pay = e.target.value; calc(); };
      $('#amt', el).readOnly = true;
      $('#amtNote', el).textContent = 'คำนวณจากลิตรให้อัตโนมัติ';
      calc();
    };
    const calc = () => {
      const f = S.fuel;
      const r = calcFuel({ liters: f.liters, price: f.price, pointCardId: f.pointCardId, payCardId: f.pay.indexOf('card:') === 0 ? f.pay.slice(5) : '', station: f.station });
      $('#amt', el).value = r.netPaid ? r.netPaid.toFixed(2) : '';
      const pts = [r.points ? (D.card(f.pointCardId) || {}).name + ' +' + r.points : '', r.payPoints ? 'บัตรจ่าย +' + r.payPoints : ''].filter(Boolean).join(' · ');
      $('#fcalc', el).innerHTML = '<div class="line"><span>ราคาเต็ม</span><span>' + fmt2(r.total) + '</span></div>' +
        (r.discount ? '<div class="line"><span>ส่วนลด' + (r.discountLiters ? ' (โควตา ' + fmt(r.discountLiters) + ' ล.)' : '') + '</span><span class="in">+' + fmt2(r.discount) + '</span></div>' : '') +
        (pts ? '<div class="line"><span>แต้มที่ได้</span><span>' + esc(pts) + '</span></div>' : '');
    };

    // ----- ชื่อรายการที่เคยบันทึก -----
    const titleEl = $('#title', el), sug = $('#sug', el);
    const showSug = () => {
      const q = titleEl.value.trim().toLowerCase();
      const list = (App.data.titleSuggestions || []).filter(s => s.type === S.type && (!q || s.title.toLowerCase().indexOf(q) >= 0) && s.title !== titleEl.value).slice(0, 5);
      if (!list.length || document.activeElement !== titleEl) { sug.innerHTML = ''; return; }
      sug.innerHTML = '<div class="suggest"><div class="s" style="padding:8px 14px 4px">เคยบันทึก</div>' + list.map((s, i) =>
        '<button type="button" data-sg="' + i + '"><span class="ms" aria-hidden="true" style="color:#475569">history</span><span style="flex:1">' + esc(s.title) + '</span><span class="s">' + (s.count ? s.count + ' ครั้ง' : 'รายการประจำ') + '</span></button>').join('') + '</div>';
      $$('[data-sg]', sug).forEach(b => b.addEventListener('mousedown', e => {
        e.preventDefault();
        const s = list[Number(b.dataset.sg)];
        titleEl.value = s.title;
        if (s.category) { S.category = s.category; drawCats(); drawFuel(); }
        if (!num($('#amt', el).value) && s.lastAmount && !isFuel()) $('#amt', el).value = s.lastAmount;
        sug.innerHTML = '';
      }));
    };
    titleEl.addEventListener('input', debounce(showSug, 120));
    titleEl.addEventListener('focus', showSug);
    titleEl.addEventListener('blur', () => setTimeout(() => { sug.innerHTML = ''; }, 150));

    drawSlip(''); drawCats(); drawFuel();
    if (p.scan === '1') setTimeout(() => takeSlip(true), 300);

    // ----- บันทึก / ลบ -----
    $('#save', el).onclick = (e) => busy(e.currentTarget, async () => {
      const date = $('#date', el).value, title = titleEl.value.trim(), note = $('#note', el).value.trim();
      if (!date) throw new Error('กรุณาเลือกวันที่');
      if (!title) { titleEl.focus(); throw new Error('กรุณากรอกชื่อรายการ'); }
      if (isFuel()) {
        const f = S.fuel;
        if (num(f.liters) <= 0 || num(f.price) <= 0) throw new Error('กรุณากรอกลิตรและราคาต่อลิตร');
        await api('saveFuelPurchase', { record: { date, purpose: 'รถส่วนตัว', station: f.station, fuelType: f.fuelType, liters: num(f.liters), pricePerLiter: num(f.price),
          pointCardId: f.pointCardId, payCardId: f.pay.indexOf('card:') === 0 ? f.pay.slice(5) : '', payMethod: f.pay.indexOf('card:') === 0 ? 'บัตรเครดิต' : (f.pay === 'transfer' ? 'โอน' : 'เงินสด'),
          title, note, slipUrl: S.slipUrl } });
      } else {
        const amount = num($('#amt', el).value);
        if (amount <= 0) { $('#amt', el).focus(); throw new Error('กรุณากรอกจำนวนเงิน'); }
        if (!S.category) throw new Error('กรุณาเลือกหมวดหมู่');
        await api('saveRecord', { table: 'Transactions', record: { id: old ? old.id : '', date, type: S.type, category: S.category, title, amount, note, slipUrl: S.slipUrl } });
      }
      const rec = $('#rec', el);
      if (rec && rec.checked) {
        await api('saveRecord', { table: 'Recurring', record: { title, type: S.type, category: S.category, amount: num($('#amt', el).value), dayOfMonth: Number(date.slice(8, 10)), active: true, sort: 999 } });
      }
      if (date.slice(0, 7) !== App.month) App.month = date.slice(0, 7);
      await refresh();
      go(old ? '#/list' : '#/home');
    }, 'บันทึกแล้ว');
    const del = $('#del', el);
    if (del) del.onclick = async () => {
      if (!await confirmBox('ลบ "' + old.title + '" ?', 'ลบ', true)) return;
      await busy(del, async () => { await api('deleteRecord', { table: 'Transactions', id: old.id }); await refresh(); go('#/list'); }, 'ลบแล้ว');
    };
  }
});

/* ---------- ทรัพย์สิน & หนี้สิน ---------- */
const ASSET_GROUPS = ['หุ้นสหกรณ์', 'กบข.', 'กองทุน', 'แชร์', 'บิทคอยน์', 'เงินฝาก', 'อื่นๆ'];
function groupIcon(a) {
  if (a.kind === 'หนี้สิน') return /บัตร/.test(a.name) ? 'credit_card' : /ยืม/.test(a.name) ? 'person' : /ผ่อน/.test(a.name) ? 'shopping_bag' : 'real_estate_agent';
  return { 'หุ้นสหกรณ์': 'account_balance', 'กบข.': 'shield_person', 'กองทุน': 'trending_up', 'แชร์': 'groups', 'บิทคอยน์': 'currency_bitcoin', 'เงินฝาก': 'savings' }[a.group] || 'savings';
}
route('assets', {
  nav: 'assets',
  html() {
    const as = accountsOf('ทรัพย์สิน'), ds = accountsOf('หนี้สิน');
    const A = sumValue(as), Dt = sumValue(ds), tot = A + Dt || 1;
    const sub = (a) => [a.monthlyAmount ? (a.kind === 'หนี้สิน' ? 'ผ่อน ' : '+') + fmt(a.monthlyAmount) + ' / เดือน' : '', a.installment ? 'งวด ' + a.installment : '', a.qty ? fmt(a.qty, 8) + ' ' + (a.unit || '') : '', a.group && a.kind === 'ทรัพย์สิน' ? a.group : ''].filter(Boolean).join(' · ');
    return '<h1 style="font-size:22px;padding-top:6px">ทรัพย์สิน &amp; หนี้สิน</h1>' +
      '<div class="box pad" style="display:flex;flex-direction:column;gap:12px"><div><div class="s">ความมั่งคั่งสุทธิ</div><div class="big">' + (A - Dt < 0 ? '−' : '') + '฿' + fmt(Math.abs(A - Dt), 0) + '</div></div>' +
      '<div style="display:flex;height:12px;border-radius:6px;overflow:hidden" role="img" aria-label="ทรัพย์สิน ' + Math.round(A / tot * 100) + '% หนี้สิน ' + Math.round(Dt / tot * 100) + '%"><div style="width:' + (A / tot * 100) + '%;background:#047857"></div><div style="width:' + (Dt / tot * 100) + '%;background:#B91C1C"></div></div>' +
      '<div style="display:flex;justify-content:space-between"><div><div class="s">ทรัพย์สิน</div><div class="amt in">' + fmt(A, 0) + '</div></div><div style="text-align:right"><div class="s">หนี้สิน</div><div class="amt out">−' + fmt(Dt, 0) + '</div></div></div></div>' +
      '<div class="box"><div class="hd"><h2>ทรัพย์สิน</h2><button class="icb" data-add="ทรัพย์สิน" aria-label="เพิ่มทรัพย์สิน"><span class="ms" aria-hidden="true">add</span></button></div>' +
      (as.length ? as.map(a => a.planType ? row({ icon: PLAN_TYPES[a.planType][1], title: a.name, sub: PLAN_TYPES[a.planType][0] + ' · ดูแผน/ประวัติ', amount: fmt(accValue(a), 0), kind: 'in', href: '#/plan?id=' + encodeURIComponent(a.id) }) : row({ icon: groupIcon(a), title: a.name, sub: sub(a), amount: fmt(a.value, 0), kind: 'in', attrs: 'data-acc="' + esc(a.id) + '"' })).join('') : '<div class="empty">ยังไม่มีรายการ</div>') + '</div>' +
      '<div class="box"><div class="hd"><h2>หนี้สิน</h2><button class="icb" data-add="หนี้สิน" aria-label="เพิ่มหนี้สิน"><span class="ms" aria-hidden="true">add</span></button></div>' +
      (ds.length ? ds.map(a => a.planType ? row({ icon: PLAN_TYPES[a.planType][1], title: a.name, sub: PLAN_TYPES[a.planType][0] + ' · ดูแผน/ประวัติ', amount: '−' + fmt(accValue(a), 0), kind: 'out', href: '#/plan?id=' + encodeURIComponent(a.id) }) : row({ icon: groupIcon(a), title: a.name, sub: sub(a), amount: '−' + fmt(a.value, 0), kind: 'out', attrs: 'data-acc="' + esc(a.id) + '"' })).join('') : '<div class="empty">ไม่มีหนี้</div>') + '</div>' +
      '<a class="btn ghost" href="#/plans"><span class="ms" aria-hidden="true">event_repeat</span>บัญชีผ่อน &amp; สะสม · วางแผนออม/โป๊ะหนี้</a>' +
      '<button class="btn" id="updAll"><span class="ms" aria-hidden="true">edit_calendar</span>อัปเดตมูลค่าประจำเดือน</button>';
  },
  mount(p, el) {
    $$('[data-acc]', el).forEach(b => b.onclick = () => editAccount((App.data.accounts || []).find(a => a.id === b.dataset.acc)));
    $$('[data-add]', el).forEach(b => b.onclick = () => editAccount({ kind: b.dataset.add, group: b.dataset.add === 'หนี้สิน' ? 'หนี้' : 'อื่นๆ', active: true }));
    $('#updAll', el).onclick = updateAllValues;
  }
});

function editAccount(a) {
  const isDebt = a.kind === 'หนี้สิน';
  sheet('<h2>' + (a.id ? 'แก้ไข' : 'เพิ่ม') + (isDebt ? 'หนี้สิน' : 'ทรัพย์สิน') + '</h2>' +
    field('ac_name', 'ชื่อ', a.name || '') +
    (isDebt ? '' : '<div class="fld"><label class="lbl" for="ac_group">กลุ่ม</label><select id="ac_group" class="input">' + ASSET_GROUPS.map(g => '<option' + (g === a.group ? ' selected' : '') + '>' + g + '</option>').join('') + '</select></div>') +
    field('ac_value', isDebt ? 'ยอดหนี้คงเหลือ (บาท)' : 'มูลค่าปัจจุบัน (บาท)', a.value || '', 'inputmode="decimal"') +
    (isDebt ? '' : '<div class="grid2">' + field('ac_qty', 'จำนวนหน่วย (ถ้ามี)', a.qty || '', 'inputmode="decimal" placeholder="เช่น 0.0045"') + field('ac_unit', 'หน่วย', a.unit || '', 'placeholder="เช่น BTC"') + '</div>') +
    '<div class="grid2">' + field('ac_month', isDebt ? 'ผ่อนต่อเดือน' : 'ออมต่อเดือน', a.monthlyAmount || '', 'inputmode="decimal"') + (isDebt ? field('ac_inst', 'งวดที่', a.installment || '', 'placeholder="เช่น 14/121"') : '<div></div>') + '</div>' +
    field('ac_note', 'หมายเหตุ', a.note || '') +
    '<button class="btn" id="ac_save">บันทึก</button>' + (a.id ? '<button class="btn danger" id="ac_del">ลบรายการนี้</button>' : '') + '<button class="btn ghost" data-close>ยกเลิก</button>',
  (el, close) => {
    $('#ac_save', el).onclick = (e) => busy(e.currentTarget, async () => {
      const name = $('#ac_name', el).value.trim();
      if (!name) throw new Error('กรุณากรอกชื่อ');
      const rec = { id: a.id || '', kind: a.kind, name, value: num($('#ac_value', el).value), monthlyAmount: $('#ac_month', el).value, note: $('#ac_note', el).value, active: true, group: a.group || '' };
      if (!isDebt) { rec.group = $('#ac_group', el).value; rec.qty = $('#ac_qty', el).value; rec.unit = $('#ac_unit', el).value; }
      else rec.installment = $('#ac_inst', el).value;
      if (!a.id) rec.sort = 900;
      if (a.id && num(a.value) !== rec.value) { await api('updateAccountValues', { items: [{ id: a.id, value: rec.value, qty: rec.qty }] }); }
      await api('saveRecord', { table: 'Accounts', record: rec });
      await refresh(); close(); render(true);
    }, 'บันทึกแล้ว');
    const del = $('#ac_del', el);
    if (del) del.onclick = async () => {
      close();
      if (!await confirmBox('ลบ "' + a.name + '" ?', 'ลบ', true)) return;
      try { showLoading('กำลังลบ…'); await api('deleteRecord', { table: 'Accounts', id: a.id }); await refresh(); render(true); toast('ลบแล้ว'); } catch (e) { toast(e.message, 'err'); } finally { hideLoading(); }
    };
  });
}

// อัปเดตมูลค่าทุกบัญชีในครั้งเดียว (บันทึกประวัติรายเดือน)
function updateAllValues() {
  const list = accountsOf('ทรัพย์สิน').concat(accountsOf('หนี้สิน')).filter(a => !a.planType); // บัญชีที่มีแผน คำนวณเอง
  sheet('<h2>อัปเดตมูลค่าประจำเดือน</h2><div class="s">แก้เฉพาะตัวที่เปลี่ยน แล้วกดบันทึกครั้งเดียว</div>' +
    list.map(a => '<div class="fld"><label class="lbl" for="uv_' + esc(a.id) + '">' + esc(a.name) + (a.kind === 'หนี้สิน' ? ' (หนี้)' : '') + '</label><input class="input ' + (a.kind === 'หนี้สิน' ? 'out' : '') + '" id="uv_' + esc(a.id) + '" inputmode="decimal" value="' + esc(a.value) + '"></div>').join('') +
    '<button class="btn" id="uv_save">บันทึกทั้งหมด</button><button class="btn ghost" data-close>ยกเลิก</button>',
  (el, close) => {
    $('#uv_save', el).onclick = (e) => busy(e.currentTarget, async () => {
      const items = list.map(a => ({ id: a.id, value: num(document.getElementById('uv_' + a.id).value) })).filter((it, i) => it.value !== num(list[i].value));
      if (!items.length) { close(); return; }
      await api('updateAccountValues', { items });
      await refresh(); close(); render(true);
    }, 'อัปเดตแล้ว');
  });
}

function quotaHtml(c) {
  const st = D.cardStatus(c.id) || { quotaLeft: num(c.quotaLiters) };
  const total = num(c.quotaLiters), left = num(st.quotaLeft);
  const pct = total ? Math.round(left / total * 100) : 0;
  return '<div style="padding:12px 16px;border-top:1px solid #F1F5F9;display:flex;flex-direction:column;gap:8px">' +
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="t">' + esc(c.name) + (c.owner ? ' <span class="s" style="font-weight:400">· ' + esc(c.owner) + '</span>' : '') + '</span><span style="font-weight:700;white-space:nowrap">เหลือ ' + fmt(left) + ' / ' + fmt(total) + ' ล.</span></div>' +
    '<div class="bar" role="img" aria-label="โควตาเหลือ ' + fmt(left) + ' จาก ' + fmt(total) + ' ลิตร"><div style="width:' + pct + '%;background:#047857"></div></div>' +
    '<div style="font-size:14px">' + (left <= 0 ? '<span class="warn" style="font-weight:700">หมดแล้ว · ใช้ใบอื่น</span>' : '<span class="in" style="font-weight:700">ลดได้อีก ' + fmt(left * num(c.discountPerLiter)) + ' บาท</span>') + '</div></div>';
}
function quotaCards() { return D.activeCards().filter(c => num(c.quotaLiters) > 0); }
function nextResetText() { const st = (App.data.cardStatus || []).find(s => s.quotaLiters > 0); return st ? 'รีเซ็ต ' + thDate(st.nextReset) : ''; }

/* ---------- หน้าหลักตู้น้ำมัน ---------- */
route('fuel', {
  nav: 'fuel',
  html() {
    const d = App.data, sm = d.fuel.summary;
    const pumps = D.activePumps();
    const price95 = D.price('95');
    const pumpHtml = (p) => {
      const st = D.pumpStatus(p.id) || {}, b = d.fuel.byPump[p.id] || { netProfit: 0 };
      const cap = num(p.tankCapacity) || 200, min = num(p.minLevel);
      const pct = Math.max(0, Math.min(100, st.stock / cap * 100));
      const ev = st.lastEvent && ['โดนงัด', 'ตู้เสีย / ปิด'].indexOf(st.lastEvent.eventType) >= 0 && st.lastEvent.date >= addMonth(App.month, -1) ? '<span class="tag out">' + esc(st.lastEvent.eventType) + '</span>' : '';

        '<div class="amt ' + (b.netProfit >= 0 ? 'in' : 'out') + '">' + money(b.netProfit, b.netProfit >= 0 ? 'in' : 'out', 0) + '</div></div>' + stock + '</div>';

      '<div class="box pad" style="display:flex;flex-direction:column;gap:12px"><div><div class="s">กำไรสุทธิเดือนนี้</div><div class="big ' + (sm.netProfit >= 0 ? 'in' : 'out') + '">' + (sm.netProfit >= 0 ? '+' : '−') + '฿' + fmt(Math.abs(sm.netProfit)) + '</div></div>' +
      '<div class="grid3"><div><div class="s">ขายได้</div><div class="amt">' + fmt(sm.liters, 1) + ' ล.</div></div><div><div class="s">ยอดขาย</div><div class="amt in">+' + fmt(sm.sales, 0) + '</div></div><div><div class="s">ซื้อน้ำมัน</div><div class="amt out">−' + fmt(sm.purchaseCost, 0) + '</div></div></div>' +
      (sm.expense ? '<div class="s">หักค่าใช้จ่าย/ความเสียหาย ' + fmt(sm.expense) + ' บาท</div>' : '') + '</div>' +
      '<div class="grid3"><a href="#/fuel-buy" class="btn2"><span class="ms" aria-hidden="true">shopping_cart</span>ซื้อน้ำมัน</a><a href="#/fuel-meter" class="btn2"><span class="ms" aria-hidden="true">speed</span>จดมิเตอร์</a><a href="#/fuel-event" class="btn2"><span class="ms" aria-hidden="true">report</span>เหตุการณ์</a></div>' +
      '<div class="box"><div class="hd"><h2>ตู้ของฉัน</h2><button class="icb" id="addPump" aria-label="เพิ่มตู้"><span class="ms" aria-hidden="true">add</span></button></div>' + pumps.map(pumpHtml).join('') + '</div>' +
      (qc.length ? '<div class="box"><div class="hd"><h2>โควตาส่วนลดบัตร</h2><span class="s">' + nextResetText() + '</span></div>' + qc.map(quotaHtml).join('') +
        row({ icon: 'loyalty', title: 'แต้มสะสมทุกบัตร', sub: D.activeCards().length + ' ใบ' + (ptsVal ? ' · แลกได้ ≈ ' + fmt(ptsVal, 0) + ' บาท' : ''), href: '#/cards' }) + '</div>'

function editPump(p) {
  sheet('<h2>' + (p.id ? 'แก้ไขตู้' : 'เพิ่มตู้ใหม่') + '</h2>' + field('pm_name', 'ชื่อตู้', p.name || '', 'placeholder="เช่น ตู้หน้าตลาด"') +
    '<div class="grid2">' + field('pm_price', 'ราคาขาย/ลิตร', p.sellPrice, 'inputmode="decimal"') + field('pm_type', 'ชนิดน้ำมัน', p.fuelType || '95') + '</div>' +
    '<div class="grid2">' + field('pm_cap', 'ถังจุ (ลิตร)', p.tankCapacity, 'inputmode="numeric"') + field('pm_min', 'ขั้นต่ำที่ขายได้ (ลิตร)', p.minLevel, 'inputmode="numeric"') + '</div>' +
    '<button class="btn" id="pm_save">บันทึก</button><button class="btn ghost" data-close>ยกเลิก</button>', (el, close) => {
    $('#pm_save', el).onclick = (e) => busy(e.currentTarget, async () => {
      const name = $('#pm_name', el).value.trim();
      if (!name) throw new Error('กรุณาตั้งชื่อตู้');
